AccountStatementListItemDto:
  type: object
  properties:
    accountStatementUuid:
      type: string
      format: uuid
    vendorNumber:
      type: integer
      format: int64
    vendorName:
      type: string
    year:
      type: integer
    month:
      type: integer
    status:
      type: integer
    statusLabel:
      type: string
    processedAt:
      type: string
      format: date-time
      x-nullable: true
    reviewedAt:
      type: string
      format: date-time
      x-nullable: true
  required:
    - accountStatementUuid
    - vendorNumber
    - vendorName
    - year
    - month
    - status
    - statusLabel

AccountStatementDetailDto:
  type: object
  properties:
    accountStatementUuid:
      type: string
      format: uuid
    vendorNumber:
      type: integer
      format: int64
    vendorName:
      type: string
    year:
      type: integer
    month:
      type: integer
    version:
      type: integer
    status:
      type: integer
    statusLabel:
      type: string
    initialBalance:
      type: string
      x-nullable: true
    finalBalance:
      type: string
      x-nullable: true
    processedAt:
      type: string
      format: date-time
      x-nullable: true
    reviewedAt:
      type: string
      format: date-time
      x-nullable: true
    issuedAt:
      type: string
      format: date-time
      x-nullable: true
    periodStart:
      type: string
      format: date
      x-nullable: true
  required:
    - accountStatementUuid
    - vendorNumber
    - vendorName
    - year
    - month
    - version
    - status
    - statusLabel

AccountStatementListResponseDto:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "#/AccountStatementListItemDto"
    totalItems:
      type: integer
    totalPages:
      type: integer
    currentPage:
      type: integer
  required:
    - items
    - totalItems
    - totalPages
    - currentPage

AccountStatementReportIssuerDto:
  type: object
  properties:
    name:
      type: string
    address:
      type: string
    rfc:
      type: string
    phone:
      type: string
    email:
      type: string

AccountStatementReportVendorDto:
  type: object
  properties:
    vendorNumber:
      type: integer
      format: int64
    vendorName:
      type: string
    providerRfc:
      type: string
    providerCp:
      type: string
    providerAddress:
      type: string
    providerContact:
      type: string
    providerEmail:
      type: string

AccountStatementReportMetaDto:
  type: object
  properties:
    accountStatementUuid:
      type: string
      format: uuid
    vendorNumber:
      type: integer
      format: int64
    year:
      type: integer
    month:
      type: integer
    version:
      type: integer
    initialBalance:
      type: number
      format: double
      x-nullable: true
    finalBalance:
      type: number
      format: double
      x-nullable: true

AccountStatementReportDatesDto:
  type: object
  properties:
    issueDate:
      type: string
      format: date-time
      x-nullable: true
    periodStart:
      type: string
      format: date-time
      x-nullable: true
    periodEnd:
      type: string
      format: date-time
      x-nullable: true
    generatedAt:
      type: string
      format: date-time

AccountStatementReportTotalsCountsDto:
  type: object
  properties:
    purchaseOrders:
      type: integer
    facturas:
      type: integer
    payments:
      type: integer
    rebates:
      type: integer
    notasCredito:
      type: integer

AccountStatementReportTotalsDto:
  type: object
  properties:
    totalOC:
      type: number
      format: double
    totalFacturasPendientes:
      type: number
      format: double
    totalFacturasPagadas:
      type: number
      format: double
    totalDescuentos:
      type: number
      format: double
    totalNotasCredito:
      type: number
      format: double
    saldoPendiente:
      type: number
      format: double
    counts:
      $ref: "#/AccountStatementReportTotalsCountsDto"

AccountStatementStatusCatalogItemDto:
  type: object
  properties:
    key:
      type: string
    description:
      type: string
    color:
      type: string
      x-nullable: true
    sortOrder:
      type: integer

AccountStatementReportCatalogsDto:
  type: object
  properties:
    invoiceStatus:
      type: array
      items:
        $ref: "#/AccountStatementStatusCatalogItemDto"
    paymentStatus:
      type: array
      items:
        $ref: "#/AccountStatementStatusCatalogItemDto"
    creditNoteStatus:
      type: array
      items:
        $ref: "#/AccountStatementStatusCatalogItemDto"

AccountStatementReportDataDto:
  type: object
  description: Full account statement dataset for client-side rendering (PDF/HTML).
  properties:
    meta:
      $ref: "#/AccountStatementReportMetaDto"
    issuer:
      $ref: "#/AccountStatementReportIssuerDto"
    vendor:
      $ref: "#/AccountStatementReportVendorDto"
    dates:
      $ref: "#/AccountStatementReportDatesDto"
    totals:
      $ref: "#/AccountStatementReportTotalsDto"
    purchaseOrders:
      type: array
      items:
        type: object
    receptions:
      type: array
      items:
        type: object
    payments:
      type: array
      items:
        type: object
    rebates:
      type: array
      items:
        type: object
    facturas:
      type: array
      items:
        type: object
    notasCredito:
      type: array
      items:
        type: object
    catalogs:
      $ref: "#/AccountStatementReportCatalogsDto"
  required:
    - meta
    - issuer
    - vendor
    - dates
    - totals
    - purchaseOrders
    - receptions
    - payments
    - rebates
    - facturas
    - notasCredito
    - catalogs
