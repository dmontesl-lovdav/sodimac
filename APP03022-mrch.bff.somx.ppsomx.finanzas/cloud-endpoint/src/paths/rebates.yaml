rebates:
  get:
    tags: [rebates]
    summary: List rebates
    operationId: listRebates
    produces: [application/json]
    responses:
      "200":
        description: List of rebates
        schema:
          type: array
          items:
            $ref: "../definitions/rebates.yaml#/RebateDto"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  post:
    tags: [rebates]
    summary: Create rebate
    operationId: createRebate
    consumes: [application/json]
    produces: [application/json]
    parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/rebates.yaml#/CreateRebateDto"
    responses:
      "201":
        description: Created
        schema:
          $ref: "../definitions/rebates.yaml#/RebateDto"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

