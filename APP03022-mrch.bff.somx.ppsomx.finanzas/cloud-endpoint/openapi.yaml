      summary: List audit logs
      operationId: listAuditLogs
      produces:
        - application/json
      parameters:
        - name: fechaInicio
          in: query
          required: true
          description: Start datetime
          type: string
          format: date-time
        - name: fechaFin
          in: query
          required: true
          description: End datetime
          type: string
          format: date-time
        - name: idAplicativo
          in: query
          required: false
          description: Service/App name
          type: string
        - name: modulo
          in: query
          required: false
          description: Module
          type: string
        - name: idTransaccion
          in: query
          required: false
          description: Transaction id (trace_id)
          type: string
          format: uuid
        - name: tipoEvento
          in: query
          required: false
          description: Event type
          type: string
          enum:
            - ALL
            - ERROR
            - ALERTA
            - INFO
        - name: codigoError
          in: query
          required: false
          description: Error code
          type: string
        - name: search
          in: query
          required: false
          description: Free text search
          type: string
        - name: page
          in: query
          required: false
          description: Page number
          type: integer
          default: 1
        - name: limit
          in: query
          required: false
          description: Page size
          type: integer
          default: 10
      responses:
        '200':
          description: List of audit logs
          schema:
            $ref: '#/definitions/AuditLogsListResponse'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '401':
