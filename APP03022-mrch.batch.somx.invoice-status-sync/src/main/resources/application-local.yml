    max-execution-minutes: 15
  datasource:
    url: jdbc:sqlserver://localhost:1434;databaseName=SODIMAC_BATCH_DEV;encrypt=false;trustServerCertificate=true
    username: SA
    password: 'Sodimac2026#Dev'

fbc:
