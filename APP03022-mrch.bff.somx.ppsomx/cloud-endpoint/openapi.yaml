        type: integer
    type: object
  BulkCategoryUploadResult:
    properties:
      errors:
        items:
          $ref: "#/definitions/ErrorRow"
        type: array
      inserted:
        format: int32
        type: integer
      skipped:
        format: int32
        type: integer
    type: object
  BulkFaqUploadResult:
    properties:
      errors:
        items:
