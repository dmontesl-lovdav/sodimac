definitions:
  AttachmentDto:
    properties:
      author:
        description: Name or email of uploader.
        example: Gabriel Galván
        type: string
      content:
        description: Base64 file content
        example: R2FicmllbCBHYWx2w6Fu
        type: string
      creationTime:
        format: date-time
        type: string
      id:
        format: int32
        type: integer
