
# ==========================================================

sonar.sources=src
sonar.sourceEncoding=UTF-8

# ==========================================================
# Alcance del análisis productivo
# ==========================================================

sonar.inclusions=\
src/lib/errors.ts,\
src/services/cache.service.ts,\
src/controllers/healthCheck.controller.ts,\
src/middlewares/internalServiceAuth.ts,\
src/services/sharedCatalog.service.ts,\
src/controllers/transactionId.controller.ts,\
src/repositories/ShippingGuideFile.repo.ts,\
src/workers/threeWayMatch.batch.ts

# ==========================================================
# Pruebas
# ==========================================================

sonar.tests=src

sonar.test.inclusions=\
src/**/__tests__/**/*.ts,\
src/**/*.test.ts,\
src/**/*.spec.ts

sonar.exclusions=\
src/**/__tests__/**,\
src/**/*.test.ts,\
src/**/*.spec.ts,\
src/**/__mocks__/**,\
dist/**,\
coverage/**,\
node_modules/**

# ==========================================================
# Coverage
# ==========================================================

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
src/controllers/healthCheck.controller.ts,\
src/middlewares/internalServiceAuth.ts,\
src/services/sharedCatalog.service.ts,\
src/controllers/transactionId.controller.ts,\
src/repositories/ShippingGuideFile.repo.ts,\
src/workers/threeWayMatch.batch.ts

# ==========================================================
# Duplicaciones
# ==========================================================

sonar.cpd.exclusions=src/**