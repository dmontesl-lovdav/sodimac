ModuleDto:
  type: object
  properties:
    idModule:
      type: integer
      format: int32
      description: Unique identifier
    name:
      type: string
      description: Module name
    description:
      type: string
      description: Module description
    createdBy:
      type: integer
      format: int64
      description: User who created the record
    createdAt:
      type: string
      format: date-time
    updatedBy:
      type: integer
      format: int64
      description: User who last updated the record
    updatedAt:
      type: string
      format: date-time

CreateModuleDto:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    description:
      type: string
    createdBy:
      type: integer
      format: int64

UpdateModuleDto:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    updatedBy:
      type: integer
      format: int64

ModuleListResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: array
      items:
        $ref: "#/ModuleDto"
    count:
      type: integer
      format: int32

ModuleSingleResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      $ref: "#/ModuleDto"

ModuleDeleteResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: Modulo eliminado exitosamente
