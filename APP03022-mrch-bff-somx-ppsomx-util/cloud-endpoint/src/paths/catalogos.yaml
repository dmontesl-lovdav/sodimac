catalogos:
  get:
    tags:
      - catalogos
    summary: List catalogs with filters and pagination
    operationId: listCatalogos
    produces:
      - application/json
    parameters:
      - name: id
        in: query
        required: false
        type: integer
        format: int32
      - name: nombre
        in: query
        required: false
        type: string
      - name: descripcion
        in: query
        required: false
        type: string
      - name: tipo
        in: query
        required: false
        type: string
        enum: [PRIMARIO, SECUNDARIO]
      - name: code
        in: query
        required: false
        type: string
      - name: prefix
        in: query
        required: false
        type: string
      - name: estatus
        in: query
        required: false
        type: integer
        format: int32
      - name: page
        in: query
        required: false
        type: integer
        format: int32
        default: 1
      - name: pageSize
        in: query
        required: false
        type: integer
        format: int32
        default: 10
      - name: sortBy
        in: query
        required: false
        type: string
        default: createdAt
      - name: sortDir
        in: query
        required: false
        type: string
        enum: [asc, desc]
        default: desc
    responses:
      "200":
        description: Paginated catalogs
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogPageResponse"
    security:
      - bearerAuth: []

  post:
    tags:
      - catalogos
    summary: Create catalog
    operationId: createCatalogo
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - name: X-User-Id
        in: header
        required: false
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogCreateDto"
    responses:
      "201":
        description: Created
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogResponseDto"
      "400":
        description: Invalid data
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "409":
        description: Duplicated code/prefix
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

catalogos-by-id:
  get:
    tags:
      - catalogos
    summary: Get catalog by ID (management)
    operationId: getCatalogoById
    produces:
      - application/json
    parameters:
      - name: id
        in: path
        required: true
        type: integer
        format: int32
    responses:
      "200":
        description: Catalog
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogResponseDto"
      "404":
        description: Not found
    security:
      - bearerAuth: []

  put:
    tags:
      - catalogos
    summary: Update catalog
    operationId: updateCatalogo
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - name: id
        in: path
        required: true
        type: integer
        format: int32
      - name: X-User-Id
        in: header
        required: false
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogUpdateDto"
    responses:
      "200":
        description: Updated
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogResponseDto"
      "404":
        description: Not found
    security:
      - bearerAuth: []

catalogos-primarios:
  get:
    tags:
      - catalogos
    summary: List primary/hierarchical catalogs
    operationId: listPrimaryCatalogs
    produces:
      - application/json
    responses:
      "200":
        description: List
        schema:
          type: array
          items:
            $ref: "../definitions/catalog.yaml#/CatalogSimpleDto"
    security:
      - bearerAuth: []

catalogos-detalle:
  get:
    tags:
      - catalogos
    summary: Get simple catalog info
    operationId: getCatalogoSimple
    produces:
      - application/json
    parameters:
      - name: catalogId
        in: path
        required: true
        type: integer
        format: int32
    responses:
      "200":
        description: Catalog simple info
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogSimpleDto"
      "404":
        description: Not found
    security:
      - bearerAuth: []

catalogos-elementos:
  get:
    tags:
      - catalogos
    summary: List catalog elements
    operationId: listCatalogElements
    produces:
      - application/json
    parameters:
      - name: catalogId
        in: path
        required: true
        type: integer
        format: int32
      - name: idElemento
        in: query
        required: false
        type: integer
        format: int32
      - name: elemento
        in: query
        required: false
        type: string
      - name: valor
        in: query
        required: false
        type: string
      - name: idCatalogoPadre
        in: query
        required: false
        type: integer
        format: int32
      - name: idElementoPadre
        in: query
        required: false
        type: integer
        format: int32
      - name: clave
        in: query
        required: false
        type: string
      - name: estatus
        in: query
        required: false
        type: integer
        format: int32
      - name: page
        in: query
        required: false
        type: integer
        format: int32
        default: 1
      - name: pageSize
        in: query
        required: false
        type: integer
        format: int32
        default: 10
      - name: sortBy
        in: query
        required: false
        type: string
        default: createdAt
      - name: sortDir
        in: query
        required: false
        type: string
        enum: [asc, desc]
        default: desc
    responses:
      "200":
        description: Paginated elements
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementPageResponse"
      "404":
        description: Catalog not found
    security:
      - bearerAuth: []

  post:
    tags:
      - catalogos
    summary: Create catalog element
    operationId: createCatalogElement
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - name: catalogId
        in: path
        required: true
        type: integer
        format: int32
      - name: X-User-Id
        in: header
        required: false
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementCreateDto"
    responses:
      "201":
        description: Created
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementDto"
      "400":
        description: Invalid data
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "404":
        description: Catalog not found
    security:
      - bearerAuth: []

catalogos-elementos-activos:
  get:
    tags:
      - catalogos
    summary: List active elements
    operationId: listActiveElements
    produces:
      - application/json
