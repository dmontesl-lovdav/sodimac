# ---- JPA ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false

# ---- Sin servidor web (ejecucion batch via .bat) ----
spring.main.web-application-type=none
spring.main.banner-mode=off

# ---- Logging (solo errores de Spring, nuestros logs en INFO) ----
logging.level.root=ERROR
logging.level.com.sodimac.batch.fiscal.download=INFO

# ---- fiscal-api ----
fiscal-api.url=http://localhost:8082
fiscal-api.timeout-ms=10000

# ---- Batch config ----
batch.search.months-back=6
