components:
  schemas:
    RelatedInformationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        link:
          type: string
        image:
          type: string
        imageName:
          type: string
        isActive:
          type: boolean
        businessUnitId:
          type: integer
          format: int32
        countryId:
          type: integer
          format: int32
      required:
        - link
        - title
    ExceptionWrapper:
      type: object
      properties:
        message:
          type: string
          description: Error description
          example: Unauthorized
        code:
          type: integer
          format: int32
          description: Numeric HTTP Status error
          example: 401
    NoticeDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Unique numeric identifier.
          example: 6
        businessUnit:
          type: integer
          format: int32
          description: Business Unit. See `catalogs` methods for further info.
          example: 6
        country:
          type: integer
          format: int32
          description: Country of origin. See `catalogs` methods for further info.
          example: 6
        name:
          type: string
          description: Info's title
          example: 6
          maxLength: 64
          minLength: 2
        description:
          type: string
          description: Info's long description - paragraph.
          example: 6
          maxLength: 128
          minLength: 2
        link:
          type: string
          description: Info's hyperlink
          example: 6
          maxLength: 256
          minLength: 2
        position:
          type: integer
          format: int32
          description: Info's position or location
          example: 6
        published:
          type: boolean
          description: Publish status
          example: true
      required:
        - businessUnit
        - country
        - position
    FeedbackAnswerDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        position:
          type: integer
          format: int32
    FeedbackDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        question:
          type: string
        isActive:
          type: boolean
        answers:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackAnswerDto"
    FaqResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        question:
          type: string
        answer:
          type: string
        categoryName:
          type: string
    UpdateFaqRequest:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
        question:
          type: string
          maxLength: 512
          minLength: 0
        answer:
          type: string
        aliases:
          type: array
          items:
            type: string
        relatedIds:
          type: array
          items:
            type: integer
            format: int64
        files:
          type: array
          items:
            type: string
            format: binary
      required:
        - answer
        - categoryId
        - question
    FaqCategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
    FaqCategoryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        isActive:
          type: boolean
      required:
        - description
        - name
    CreateShipmentGuideRequest:
      type: object
      properties:
        providerNumber:
          type: integer
          format: int64
        guideNumber:
          type: string
          pattern: "^[A-Z0-9-]{4,50}$"
        plate:
          type: string
        trailerPlate:
          type: string
        origin:
          type: string
        deliveryType:
          type: string
        amount:
          type: number
          minimum: 0.01
        deliveryDate:
          type: string
          format: date
        shippingDate:
          type: string
          format: date
        purchaseOrders:
          type: array
          items:
            type: integer
            format: int64
        receipts:
          type: array
          items:
            type: integer
            format: int64
        comments:
          type: string
      required:
        - amount
        - deliveryDate
        - deliveryType
        - guideNumber
        - origin
        - providerNumber
        - purchaseOrders
        - receipts
        - shippingDate
    AttachmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: Attachment filename
          example: constancia_fiscal.pdf
        content:
          type: string
          description: Base64 file content
          example: R2FicmllbCBHYWx2w6Fu
        creationTime:
          type: string
          format: date-time
        author:
          type: string
          description: Name or email of uploader.
          example: Gabriel Galván
    CommentDto:
      type: object
      properties:
