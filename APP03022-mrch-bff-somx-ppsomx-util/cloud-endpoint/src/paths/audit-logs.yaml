audit-logs:
  get:
    tags:
      - audit-logs
    summary: List audit logs
    operationId: listAuditLogs
    produces:
      - application/json
    parameters:
      - name: fechaInicio
        in: query
        required: true
        description: Start datetime
        type: string
        format: date-time
      - name: fechaFin
        in: query
        required: true
        description: End datetime
        type: string
        format: date-time
      - name: idAplicativo
        in: query
        required: false
        description: Service/App name
        type: string
      - name: modulo
        in: query
        required: false
        description: Module
        type: string
      - name: idTransaccion
        in: query
        required: false
        description: Transaction id (trace_id)
        type: string
        format: uuid
      - name: tipoEvento
        in: query
        required: false
        description: Event type
        type: string
        enum:
          - ALL
          - ERROR
          - ALERTA
          - INFO
      - name: codigoError
        in: query
        required: false
        description: Error code
        type: string
      - name: search
        in: query
        required: false
        description: Free text search
        type: string
      - name: page
        in: query
        required: false
        description: Page number
        type: integer
        default: 1
      - name: limit
        in: query
        required: false
        description: Page size
        type: integer
        default: 10
    responses:
      "200":
        description: List of audit logs
        schema:
          $ref: "../definitions/audit-logs.yaml#/AuditLogsListResponse"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  post:
    tags:
      - audit-logs
    summary: Create audit log
    operationId: createAuditLog
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/audit-logs.yaml#/CreateAuditLogDto"
    responses:
      "201":
        description: Created
        schema:
          $ref: "../definitions/audit-logs.yaml#/CreateAuditLogResponse"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

audit-logs-export-csv:
  get:
    tags:
      - audit-logs
    summary: Export audit logs as CSV
    operationId: exportAuditLogsCsv
    produces:
      - text/csv
    parameters:
      - name: fechaInicio
        in: query
        required: true
        description: Start datetime
        type: string
        format: date-time
      - name: fechaFin
        in: query
        required: true
        description: End datetime
        type: string
        format: date-time
      - name: idAplicativo
        in: query
        required: false
        description: Service/App name
        type: string
      - name: modulo
        in: query
        required: false
        description: Module
        type: string
      - name: idTransaccion
        in: query
        required: false
        description: Transaction id (trace_id)
        type: string
        format: uuid
      - name: tipoEvento
        in: query
        required: false
        description: Event type
        type: string
        enum:
          - ALL
          - ERROR
          - ALERTA
          - INFO
      - name: codigoError
        in: query
        required: false
        description: Error code
        type: string
      - name: search
        in: query
        required: false
        description: Free text search
        type: string
    responses:
      "200":
        description: CSV file
        schema:
          type: string
          example: "IdLog,IdTransaccion,..."
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

audit-logs-by-transaction:
  get:
    tags:
      - audit-logs
    summary: Get audit logs by transaction id
    operationId: getAuditLogsByTransaction
    produces:
      - application/json
    parameters:
      - name: idTransaccion
        in: path
        required: true
        description: Transaction id (trace_id)
        type: string
        format: uuid
    responses:
      "200":
        description: Audit logs grouped by transaction id
        schema:
          $ref: "../definitions/audit-logs.yaml#/AuditLogsByTransactionResponse"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

audit-logs-by-id:
  get:
    tags:
      - audit-logs
    summary: Get audit log detail by id
    operationId: getAuditLogDetail
    produces:
      - application/json
    parameters:
      - name: id
        in: path
        required: true
        description: Audit log UUID
        type: string
        format: uuid
    responses:
      "200":
        description: Audit log detail
        schema:
          $ref: "../definitions/audit-logs.yaml#/AuditLogDto"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []
