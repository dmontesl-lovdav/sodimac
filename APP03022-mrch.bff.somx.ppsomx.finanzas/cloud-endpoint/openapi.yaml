          description: Finanzas payment UUID
          type: string
          format: uuid
        - name: paymentDate
          in: query
          required: false
          description: Payment date
          type: string
          format: date
        - name: documentNumber
          in: query
          required: false
          description: Document number
          type: string
        - name: sapDocument
          in: query
          required: false
          description: SAP document
          type: string
        - name: pageNumber
          in: query
          required: true
          description: Page number
          type: integer
        - name: pageSize
          in: query
          required: true
          description: Page size
          type: integer
