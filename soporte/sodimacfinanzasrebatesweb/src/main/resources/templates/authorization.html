<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
<meta charset="utf-8">

<!-- ↓ Meta content ↓ -->
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta http-equiv="x-ua-compatible" content="ie=edge">

<!-- ↓ Page title ↓ -->
<title>Rebates - Home</title>

<!-- ↓ Navigation icon ↓ -->
<link th:href="@{/img/favicon.ico}" rel="shortcut icon"
	type="image/x-icon">

<!-- ↓ Font awesome ↓ -->
<link th:href="@{/fontawesome-5.15.1/css/all.min.css}" rel="stylesheet">
<!-- ↓ Fonts Roboto ↓ -->
<link th:href="@{/css/roboto.css}" rel="stylesheet">
<!-- ↓ Bootstrap core CSS ↓ -->
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
<link th:href="@{/css/mdb-pro.css}" rel="stylesheet">
<link th:href="@{/css/addons/datatables.css}" rel="stylesheet">

<!-- Your custom styles (optional) -->
<link th:href="@{/css/jquery-ui.css}" rel="stylesheet">
<link th:href="@{/css/dataTables.checkboxes.css}" type="text/css" rel="stylesheet">
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

	<!-- Header -->
	<header th:insert="fragments/header :: header-principal" id="header">

	</header>


	<!-- Start your project here-->

	<section class="mt-5 animated fadeIn">
		<form id="authorization" th:action="@{/authorization/consult}"
			th:object="${autorizacion}" method="post" onsubmit="">
			<div class="mask rgba-gradient">
				<div class="container h-100 mt-5">
					<!--Grid row-->
					<div class="row pt-5 mt-5">
						<!-- ROW 1 -->
						<div class="col-md-12 mt-1 mb-1">
							<div class="form-row">
								<!-- Descripcion search -->
								<div class="col-sm-12 col-md-2 col-lg-4 colis">
									<div class="md-form form-sm">
										<input type="text" id="descripcion-periodo"
											name="descripcionPeriodo" minlegth="2" maxlength="30"
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off"> <label class="label-gcis"
											for="descripcion-periodo"><i
											class="fa fa-search mr-2" style="opacity: .6;"
											aria-hidden="true"></i>Descripción período</label>
									</div>
								</div>
								<!-- Id Periodo search -->
								<div class="col-lg-2 select-outline colis position-relative">
									<div class="md-form form-sm">
										<input type="number" id="periodo-idCatPeriodo"
											name="periodo.idCatPeriodo" min="1" max="2147483647"
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off"> <label class="label-gcis"
											for="periodo-idCatPeriodo"><i
											class="fa fa-search mr-2" style="opacity: .6;"
											aria-hidden="true"></i>Id período</label>
									</div>
								</div>
								<!-- Fecha inicio search -->
								<div class="col-lg-2 colis">
									<div id="date-picker-from" class="md-form md-outline"
										style="margin-bottom: 18px;">
										<!-- <input type="date" id="fechaIni" name="fechaIni" th:value="${fechaIni}" th:attr="max=${fechaFin}" class="form-control pickerDates" autocomplete="off" required> -->
										<input type="date" id="fechaInicio" name="fechaInicio"
											min="2018-01-01" th:attr="max=${fechaInicio}"
											class="form-control pickerDates" autocomplete="off"
											style="color: rgb(73, 80, 87);"> <label
											for="fechaInicio" class="active">Fecha inicio</label>
									</div>
								</div>
								<!-- Fecha final search -->
								<div class="col-lg-2 colis">
									<div id="date-picker-to" class="md-form md-outline"
										style="margin-bottom: 18px;">
										<!-- <input type="date" id="fechaFin" name="fechaFin" th:value="${fechaFin}" th:attr="max=${fechaFin}" class="form-control pickerDates" autocomplete="off" required> -->
										<input type="date" id="fechaFinal" name="fechaFinal"
											min="2018-01-01" th:attr="max=${fechaFinal}"
											class="form-control pickerDates" autocomplete="off"
											style="color: rgb(73, 80, 87);"> <label
											for="fechaFinal" class="active">Fecha final</label>
									</div>
								</div>

								<!-- <div class="col-sm-12 col-md-2 col-lg-1 colis"></div> -->
								<!-- Btn Consultar -->
								<div class="col-sm-12 col-md-6 col-lg-2 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div class="">
										<button th:href="@{/authorization/consult}" id="btn-consultar"
											type="submit"
											class="btn btn-outline-primary btn-sm btn-xs-block btn-sm-block waves-effect">Consultar
											Período</button>
									</div>
								</div>
							</div>
						</div>
						<!-- ROW 2 -->
						<div class="col-md-12">
							<div class="form-row">
								<!-- Tipo periodo search -->
								<div class="col-lg-3 select-outline colis">
									<select id="programaPago-idCatProgramaPago"
										name="programaPago.idCatProgramaPago"
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value="" disabled selected>Seleccionar tipo de período</option>
										<option value="">Cualquier período</option>
										<option th:each="tipo: ${tiposPeriodo}"
											th:value="${tipo.idCatProgramaPago}"
											th:text="${tipo.idCatProgramaPago + ' - ' + tipo.programaPago}">
										</option>
									</select> <label>Tipo período</label>
								</div>
								<!-- Tipo rebate search -->
								<div class="col-lg-3 select-outline colis">
									<select id="autorizacion-tipoRebate" name="tipoRebate"
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value="" disabled selected>Seleccionar tipo de rebate</option>
										<option value="">Cualquier rebate</option>
										<option th:each="rebate: ${rebates}"
											th:value="${rebate.idCatTipoRebate}"
											th:text="${rebate.idCatTipoRebate + ' - ' + rebate.nomenclatura}"></option>
									</select> <label>Tipo rebate</label>
								</div>

								<div class="col-sm-12 col-md-2 col-lg-2 colis"></div>
								
								<!-- Btn Autorizar Todos -->
								<div class="col-sm-12 col-md-6 col-lg-2 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div id="divAutorizar" class="">
										<button id="btn-confirm-all" th:attr="onclick=|multiple_confirm()|"
											type="button"
											class="btn btn-sodimac btn-sm btn-xs-block btn-sm-block waves-effect">Autorizar todos</button>
									</div>
								</div>
								
								<!-- Btn Cancelar todos -->
								<div class="col-sm-12 col-md-6 col-lg-2 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div id="divRechazar" class="">
										<button id="btn-negate-all" th:attr="onclick=|multiple_negate()|"
											type="button"
											class="btn btn-sodimac-red btn-sm btn-xs-block btn-sm-block waves-effect">Rechazar todos</button>
									</div>
								</div>
							</div>
						</div>
						<!--Grid column-->
						<div id="fragmentDiv"
							th:include="fragments/authorization :: start"
							class="col-md-12 py-3"></div>

					</div>
				</div>
			</div>
		</form>
	</section>

	<!-- Footer -->
	<footer th:insert="fragments/footer :: footer-principal"
		class="page-footer font-small grey lighten-5 fixed-bottom"> </footer>

	<!-- Script section -->
	<script type="text/javascript" th:src="@{/js/jquery-3.6.0.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/popper.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/mdb.js}"></script>
	<script type="text/javascript" th:src="@{/js/autorizacion.js}"></script>
	<script type="text/javascript" th:src="@{/js/addons/datatables.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/dataTables.checkboxes.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/sweetalert2.all.min.js}"></script>

	<script>
  	
    $( document ).ready(function() {
    
    		// Clean notify message
			toastr.clear();

      		$('.mdb-select').materialSelect();
      		$('.select-create').materialSelect();
      		$('.select-wrapper.md-form.md-outline input.select-dropdown').bind('focus blur', function () {
      			$(this).closest('.select-outline').find('label').toggleClass('active');
      			$(this).closest('.select-outline').find('.caret').toggleClass('active');
      		});
      		
      		// Validate fields
			$("#descripcion-periodo").keyup(function() {
				var $th = $(this);
				$th.val($th.val().replace(/[^A-Za-z0-9Ññ ]/g, function(str) {
					toastr.warning("Solo se permiten números y letras (0-9)(Aa-Zz, Ññ)");
					return '';
				}));
			});
      		
      		// Submit form consult
      		$("form#authorization").submit(function(e) {
    			// Stop default form Submit.
    			e.preventDefault();
    				
    			// Call Ajax Submit.
        		ajaxSubmitFormConsult();
			});
			
			// Cancel button
			$( "#btn-resetPeriodo" ).on( "click", function() {
			
  				$("#create-descripcion").val("");
  				$(".periodo-create").removeClass("active");
  				$("#create-select-periodo").materialSelect('destroy');
  				$("#create-select-periodo").val("").change();
  				$("#create-select-periodo").materialSelect();
  				$('#responsiveAddPeriodo').modal('toggle');
			});
			
			$('#btn-confirm-all').prop('disabled', true);
			$('#btn-negate-all').prop('disabled', true);
			
			$('#divAutorizar').hide();
			$('#divRechazar').hide();
			
     });
		

  </script>

</body>
</html>
