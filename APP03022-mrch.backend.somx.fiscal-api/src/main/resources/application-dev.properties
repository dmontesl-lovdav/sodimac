# ===============================
# CONFIGURACIÓN PARA DESARROLLO
# ===============================

# Ubicación de XSL en classpath
pdf.xsl.dir=classpath:/xsl/
# Marca de agua (HU)
pdf.watermark.text=Documento informativo. No sustituye al XML oficial
# Logo por defecto si CatProveedor no devuelve
pdf.logo.default=classpath:/xsl/no_logo.jpg
# Directorio permitido para leer XML por ruta física
pdf.xml.allowedBaseDir=/data/fisc/xml
# Límite de tamaño de XML (10MB)
pdf.xml.maxBytes=10485760
# Subida de archivos (si usarás multipart)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# xml.source=db     (desde base de datos)
# xml.source=remote (servicio de comprobante)
xml.source=db

comprobante.base-url=http://localhost:9001
comprobante.timeout-ms=5000

catprov.enabled=false
catprov.base-url=http://localhost:9002
catprov.timeout-ms=5000

# SECURITY CONFIGURATION (deshabilitada para dev)
security.enabled=false

pac.detecno.name=DETECNO
pac.carbajal.name=CARBAJAL

# DATABASE CONFIGURATION ──────────────────────────────────────────────
# Usa variables de entorno con valores por defecto para desarrollo local
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5434/b2b_portal?currentSchema=tenant_fiscal&useSSL=false}
spring.datasource.username=${DATASOURCE_USERNAME:wwwb2bportal}
spring.datasource.password=${DATASOURCE_PASSWORD:b8@qU0YM1HU>}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=tenant_fiscal

# LOGGING LEVEL (más detallado en dev)
logging.level.root=INFO
logging.level.Console=INFO
logging.level.com.sodimac=DEBUG

# ACTUATOR (completo en dev)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# CATALOGOS API CONFIGURATION (para dev local)
catalogs.api.enabled=false
catalogs.api.url=http://localhost:3000
catalogs.api.lang=1

# UTILS API CONFIGURATION (para dev local)
utils.api.enabled=${UTILS_API_ENABLED:true}
utils.api.url=${UTILS_API_URL:http://localhost:3712}
utils.api.timeout-ms=${UTILS_API_TIMEOUT:5000}