        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ExceptionWrapper'
      security:
        - bearerAuth: []
