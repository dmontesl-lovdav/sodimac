          type: integer
          format: int32
        - name: moduleProcessId
          in: path
          required: true
          description: Module-process identifier
          type: integer
          format: int32
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SetUserModuleProcessPayload'
      responses:
        '200':
          description: Assignment flag updated
          schema:
            $ref: '#/definitions/GenericSuccessResponse'
