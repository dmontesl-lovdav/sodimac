account-statement-batch:
  post:
    tags:
      - account-statement
    summary: Batch generate account statements
    description: >
      Generates account statement records for one or all suppliers for a given year/month.
      If a record already exists (status > 0) it is skipped silently.
      Defaults to all suppliers, current year and current month when parameters are omitted.
    operationId: batchGenerateAccountStatements
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: "../definitions/account-statement.yaml#/BatchAccountStatementBodyDto"
    responses:
      "200":
        description: Batch result
        schema:
          $ref: "../definitions/account-statement.yaml#/BatchAccountStatementResultDto"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

account-statement:
  get:
    tags:
      - account-statement
    summary: List account statements
    operationId: listAccountStatements
    produces:
      - application/json
    parameters:
      - in: query
        name: vendorNumber
        required: false
        type: integer
        format: int64
      - in: query
        name: year
        required: true
        type: integer
        minimum: 2026
      - in: query
        name: month
        required: false
        type: string
      - in: query
        name: page
        required: false
        type: integer
        minimum: 1
        default: 1
      - in: query
        name: pageSize
        required: false
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    responses:
      "200":
        description: Paged list
        schema:
          $ref: "../definitions/account-statement.yaml#/AccountStatementListResponseDto"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

account-statement-report-data:
  get:
    tags:
      - account-statement
    summary: Get account statement report data (JSON for client-side PDF)
    description: >
      Returns the full account statement payload (header, totals, purchase orders,
      receptions, payments, rebates, invoices, credit notes and status catalogs)
      used to render the statement in the portal.
    operationId: getAccountStatementReportData
    produces:
      - application/json
    parameters:
      - name: uuid
        in: path
        required: true
        type: string
        format: uuid
    responses:
      "200":
        description: Report data
        schema:
          $ref: "../definitions/account-statement.yaml#/AccountStatementReportDataDto"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

account-statement-pdf:
  get:
    tags:
      - account-statement
    summary: Get account statement PDF
    operationId: getAccountStatementPdf
    produces:
      - application/pdf
    parameters:
      - name: uuid
        in: path
        required: true
        type: string
        format: uuid
    responses:
      "200":
        description: PDF stream
        schema:
          type: string
          format: binary
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

