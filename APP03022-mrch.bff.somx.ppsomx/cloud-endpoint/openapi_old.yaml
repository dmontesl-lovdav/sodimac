swagger: "2.0"
info:
  contact:
    email: jrcastillo@falabella.cl
    name: Arquitectura Falabella Tecnologia Corp.
  description: |
    Support RESTful operations for aclaraciones flow. The main object is
    Request (Aclaración).
  title: Aclaraciones API
  version: 1.0.0
  x-business-acronym: mrch
  x-capability-acronym: odbms
  x-consumer-segments: retail
  x-service-name: odbms
host: ${DOMAIN_OPENAPI}
schemes:
  - https
paths:
  /catalogs/{type}:
    get:
      tags:
        - catalog-controller
      summary: Retrieves all Catalog objects by type and by optional parent.
      operationId: getCatalog
      produces:
        - application/json
      parameters:
        - name: type
          in: path
          description: Catalog type.
          required: true
          type: integer
          format: int32
        - name: parentId
          in: query
          description: Catalog parent id value. Optional.
          required: false
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: Catalog objects that meet given criteria.
          schema:
            type: array
            items:
              $ref: "#/definitions/CatalogDto"
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the Request-URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      security:
        - bearerAuth: []
  /faq-categories:
    get:
      produces:
        - application/json
      parameters:
        - default: false
          in: query
          name: includeIcons
          required: false
          type: boolean
      responses:
        "200":
          description: List of categories
          schema:
            $ref: "#/definitions/FaqCategoryDto"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: getFaqCategories
      summary: Returns active FAQ categories
    post:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/FaqCategoryDto"
      responses:
        "200":
          description: Updated state
          schema:
            $ref: "#/definitions/FaqCategoryResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: createFaqCategoryData
      summary: Creates a category with given data
  /faq-categories/bulk-upload:
    post:
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - format: binary
          in: formData
          name: file
          required: true
          type: string
      responses:
        "201":
          description: Import summary
          schema:
            $ref: "#/definitions/BulkCategoryUploadResult"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      description: >
        Required columns: name, description, is_active (any value except
        “false”/0 → true).
      operationId: bulkUpload_1
      summary: Bulk upload categories from CSV
  /faq-categories/template:
    get:
      produces:
        - application/octet-stream
      parameters: []
      responses:
        "200":
          description: OK
          schema:
            format: byte
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: downloadTemplate_1
      summary: Download CSV template for bulk upload
  "/faq-categories/{id}":
    delete:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          schema:
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: deleteFaqCategory
      summary: Delete category permanently
    put:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/FaqCategoryDto"
      responses:
        "200":
          description: Updated state
          schema:
            $ref: "#/definitions/FaqCategoryResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: updateFaqCategoryData
      summary: Replaces a category with given data
  "/faq-categories/{id}/publication":
    patch:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/UpdateFaqCategoryPublicationRequest"
      responses:
        "200":
          description: Updated state
          schema:
            $ref: "#/definitions/FaqCategoryResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: updateFaqCategoryPublication
      summary: Publish / unpublish a category
  "/faq-categories/{id}/publish":
    post:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FaqCategoryResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: publish_3
      summary: Publish category
  "/faq-categories/{id}/unpublish":
    post:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FaqCategoryResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-category-controller
      operationId: unpublish_3
      summary: Un-publish category
  /faqs:
    get:
      produces:
        - application/json
      parameters:
        - in: query
          name: searchTerm
          required: false
          type: string
        - format: int64
          in: query
          name: categoryId
          required: false
          type: integer
        - in: query
          name: popularOnly
          required: false
          type: boolean
        - default: 50
          format: int32
          in: query
          name: size
          required: false
          type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: "#/definitions/FaqView"
            type: array
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      description: |
        Filtra por texto libre (`searchTerm`) y/o `categoryId`.
        Si `popularOnly=true` las ordena por `views DESC`.
      operationId: getFaqs
      summary: Busca preguntas frecuentes activas
    post:
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - format: int64
          in: formData
          name: categoryId
          required: true
          type: integer
        - in: formData
          maxLength: 512
          minLength: 0
          name: question
          required: true
          type: string
        - in: formData
          name: answer
          required: true
          type: string
        - collectionFormat: csv
          in: formData
          items:
            type: string
          name: aliases
          type: array
        - collectionFormat: csv
          in: formData
          items:
            format: int64
            type: integer
          name: relatedIds
          type: array
        - collectionFormat: csv
          in: formData
          items:
            format: binary
            type: string
          name: files
          type: array
      responses:
        "201":
          description: Creada
          schema:
            $ref: "#/definitions/FaqResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      description: |
        Recibe pregunta(s), respuesta, categoría y (opcional)
        archivos adjuntos. Devuelve la FAQ recién creada.
      operationId: createFaq
      summary: Crea una nueva pregunta frecuente
  "/faqs/attachments/{id}/download":
    get:
      produces:
        - application/octet-stream
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            format: byte
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: downloadAttachment
      summary: Descarga el archivo adjunto de una FAQ
  /faqs/bulk-upload:
    post:
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - format: binary
          in: formData
          name: file
          required: true
          type: string
      responses:
        "201":
          description: Resumen de importación
          schema:
            $ref: "#/definitions/BulkFaqUploadResult"
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      description: "Columnas requeridas: question, answer, is_active"
      operationId: bulkUpload
      summary: Bulk upload FAQs from CSV
  /faqs/template:
    get:
      produces:
        - application/octet-stream
      parameters: []
      responses:
        "200":
          description: OK
          schema:
            format: byte
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: downloadTemplate
      summary: Download CSV template for FAQ bulk upload
  "/faqs/{id}":
    delete:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "204":
          description: Eliminada
        "404":
          description: FAQ no existe
          schema:
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: deleteFaq
      summary: Elimina permanentemente la FAQ
    get:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FaqDetailResponse"
        "404":
          description: No existe la FAQ
          schema:
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: getFaqById
      summary: Obtiene la FAQ por id (detalle completo)
    put:
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
        - format: int64
          in: formData
          name: categoryId
          required: true
          type: integer
        - in: formData
          maxLength: 512
          minLength: 0
          name: question
          required: true
          type: string
        - in: formData
          name: answer
          required: true
          type: string
        - collectionFormat: csv
          in: formData
          items:
            type: string
          name: aliases
          type: array
        - collectionFormat: csv
          in: formData
          items:
            format: int64
            type: integer
          name: relatedIds
          type: array
        - in: formData
          name: files
          type: string
          format: byte
          required: false
          description: "Adjunta archivo(s) codificado(s) en base64. Para múltiples, repetir el campo 'files'."
      responses:
        "200":
          description: Actualizada
          schema:
            $ref: "#/definitions/FaqResponse"
        "404":
          description: FAQ no existe
          schema:
            type: string
      tags:
        - faq-controller
      operationId: updateFaq
      summary: Actualiza la pregunta frecuente
  "/faqs/{id}/publication":
    patch:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          schema:
            $ref: "#/definitions/UpdateFaqPublicationRequest"
      responses:
        "200":
          description: Estado actualizado
          schema:
            $ref: "#/definitions/FaqResponse"
        "404":
          description: FAQ no existe
          schema:
            type: string
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: updateFaqPublication
      summary: Publica o despublica una FAQ
  "/faqs/{id}/publish":
    post:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FaqResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: publish_2
      summary: Publica la FAQ
  "/faqs/{id}/unpublish":
    post:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FaqResponse"
      security:
        - bearerAuth: []
      tags:
        - faq-controller
      operationId: unpublish_2
      summary: Despublica la FAQ
  /feedback:
    get:
      produces:
        - application/json
      parameters:
        - format: int32
          in: query
          name: size
          required: false
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FeedbackDto"
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: list_2
      summary: Returns list
    post:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/FeedbackDto"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/FeedbackDto"
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: create_2
      summary: Create record
  "/feedback/{id}":
    delete:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          schema:
            type: string
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: delete_1
      summary: Delete permanently
    get:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FeedbackDto"
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: getOne_1
      summary: Get record by id (with answers)
    put:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/FeedbackDto"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FeedbackDto"
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: update_1
      summary: Update record
  "/feedback/{id}/publish":
    post:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FeedbackDto"
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: publish_1
      summary: Publish record
  "/feedback/{id}/unpublish":
    post:
      produces:
        - application/json
      parameters:
        - format: int64
          in: path
          name: id
          required: true
          type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/FeedbackDto"
      security:
        - bearerAuth: []
      tags:
        - feedback-controller
      operationId: unpublish_1
      summary: Unpublish record
  /notices:
    get:
      produces:
        - application/json
      parameters:
        - description: KeyCloack OAuth2 token.
          in: header
          name: Authorization
          required: true
          type: string
          x-example: Bearer XXXXXXXXX
      responses:
        "200":
          description: Notice objects that meets given criteria.
          schema:
            items:
              $ref: "#/definitions/NoticeDto"
            type: array
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      tags:
        - notice-controller
      operationId: getNotices
      summary: |
        Retrieves a list of Notice (Información Relacionada) based for the
        current user session.
    post:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - description: KeyCloack OAuth2 token.
          in: header
          name: Authorization
          required: true
          type: string
          x-example: Bearer XXXXXXXXX
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/NoticeDto"
      responses:
        "200":
          description: >-
            Given notice (Información Relacionada) has been successfully
            created.
          schema:
            format: int32
            type: integer
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      tags:
        - notice-controller
      operationId: postNotice
      summary: Creates a new Notice (Información Relacionada)
  "/notices/{noticeId}":
    delete:
      produces:
        - application/json
      parameters:
        - description: KeyCloack OAuth2 token.
          in: header
          name: Authorization
          required: true
          type: string
          x-example: Bearer XXXXXXXXX
        - description: Notice (Información Relacionada) `id`.
          format: int32
          in: path
          name: noticeId
          required: true
          type: integer
          x-example: 112233
      responses:
        "200":
          description: >-
            Given notice (Información Relacionada) has been successfully
            deleted.
          schema:
            format: int32
            type: integer
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      tags:
        - notice-controller
      operationId: deleteNotice
      summary: Deletes a Notice (Información Relacionada)
    get:
      produces:
        - application/json
      parameters:
        - description: KeyCloack OAuth2 token.
          in: header
          name: Authorization
          required: true
          type: string
          x-example: Bearer XXXXXXXXX
        - description: Notice (Información Relacionada) `id`.
          format: int32
          in: path
          name: noticeId
          required: true
          type: integer
          x-example: 112233
      responses:
        "200":
          description: Notice objects with given `id`.
          schema:
            $ref: "#/definitions/NoticeDto"
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      tags:
        - notice-controller
      operationId: getNotice
      summary: Retrieves a Notice (Información Relacionada) based on its id.
    put:
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - description: KeyCloack OAuth2 token.
          in: header
          name: Authorization
          required: true
          type: string
          x-example: Bearer XXXXXXXXX
        - description: Notice (Información Relacionada) `id`.
          format: int32
          in: path
          name: noticeId
          required: true
          type: integer
          x-example: 112233
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/NoticeDto"
      responses:
        "200":
          description: >-
            Given notice (Información Relacionada) has been successfully
            updated.
          schema:
            format: int32
            type: integer
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      tags:
        - notice-controller
      operationId: putNotice
      summary: Updates a Notice (Información Relacionada)
  "/notices/{noticeId}/publish":
    post:
      produces:
        - application/json
      parameters:
        - description: KeyCloack OAuth2 token.
          in: header
          name: Authorization
          required: true
          type: string
          x-example: Bearer XXXXXXXXX
        - description: Notice (Información Relacionada) `id`.
          format: int32
          in: path
          name: noticeId
          required: true
          type: integer
          x-example: 112233
        - default: true
          description: Publishing status
          in: query
          name: publish
          required: false
          type: boolean
          x-example: true
      responses:
        "401":
          description: The request requires user authentication.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error.
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      tags:
        - notice-controller
      operationId: publishNotice
      summary: De/publish a Notice (Información Relacionada).
  /purchase-orders:
    get:
      produces:
        - application/json
      parameters:
        - format: int64
          in: query
          name: ordenCompra
          required: false
          type: integer
        - format: int64
          in: query
          name: recepcion
          required: false
          type: integer
        - format: int64
          in: query
          name: numeroProveedor
          required: false
          type: integer
        - format: int32
          in: query
          name: estatus
          required: false
          type: integer
        - format: date
          in: query
          name: fechaRecDesde
          required: false
