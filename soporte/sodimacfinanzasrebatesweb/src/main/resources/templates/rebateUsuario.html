<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
<meta charset="utf-8">

<!-- ↓ Meta content ↓ -->
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta http-equiv="x-ua-compatible" content="ie=edge">

<!-- ↓ Page title ↓ -->
<title>Rebates - Home</title>

<!-- ↓ Navigation icon ↓ -->
<link th:href="@{/img/favicon.ico}" rel="shortcut icon"
	type="image/x-icon">

<!-- ↓ Font awesome ↓ -->
<link th:href="@{/fontawesome-5.15.1/css/all.min.css}" rel="stylesheet">
<!-- ↓ Fonts Roboto ↓ -->
<link th:href="@{/css/roboto.css}" rel="stylesheet">
<!-- ↓ Bootstrap core CSS ↓ -->
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
<link th:href="@{/css/mdb-pro.min.css}" rel="stylesheet">
<link th:href="@{/css/addons/datatables.css}" rel="stylesheet">

<!-- Your custom styles (optional) -->
<link th:href="@{/css/jquery-ui.css}" rel="stylesheet">
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

	<header th:insert="fragments/header :: header-principal"> </header>

	<!-- Start your project here-->

	<section class="mt-5 animated fadeIn">
		<form id="rebateUsuario" th:action="@{/rebateUsuario/consult}"
			th:object="${periodo}" method="post" onsubmit="">
			<div class="mask rgba-gradient">
				<div class="container h-100 mt-5">
					<!--Grid row-->
					<div class="row pt-5 mt-5">
						<!-- ROW 1 -->
						<div class="col-md-12 mt-1 mb-1">
							<div class="form-row">
								<!-- Id Periodo search -->
								<div class="col-lg-3 select-outline colis position-relative">
									<select id="idCatPeriodo" name="idCatPeriodo" required
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value=0>Cualquier período</option>
										<option th:each="periodoC: ${periodos}"
											th:value="${periodoC.idCatPeriodo}" th:text="${periodoC.idCatPeriodo + ' - ' + periodoC.detallePeriodo + ' (' + periodoC.programaPago.programaPago + ')'}">
										</option>
									</select> <label>Id periodo</label>
								</div>
								<!-- Id proveedor search -->
								<div class="col-lg-3 select-outline colis position-relative">
									<div class="md-form form-sm">
										<input type="number" id="idProveedor"
											name="periodo.idProveedor" min="1" max="9999999999"
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off"> <label class="label-gcis"
											for="idProveedor"><i
											class="fa fa-search mr-2" style="opacity: .6;"
											aria-hidden="true"></i>Id proveedor</label>
									</div>
								</div>
								<!-- Fecha inicio search -->
								<div class="col-lg-2 colis">
									<div id="date-picker-from" class="md-form md-outline"
										style="margin-bottom: 18px;">
										<!-- <input type="date" id="fechaIni" name="fechaIni" th:value="${fechaIni}" th:attr="max=${fechaFin}" class="form-control pickerDates" autocomplete="off" required> -->
										<input type="date" id="fechaInicio" name="fechaInicio"
											min="2018-01-01" th:attr="max=${fechaInicio}"
											class="form-control pickerDates" autocomplete="off"
											style="color: rgb(73, 80, 87);"> <label
											for="fechaInicio" class="active">Fecha inicio</label>
									</div>
								</div>
								<!-- Fecha final search -->
								<div class="col-lg-2 colis">
									<div id="date-picker-to" class="md-form md-outline"
										style="margin-bottom: 18px;">
										<!-- <input type="date" id="fechaFin" name="fechaFin" th:value="${fechaFin}" th:attr="max=${fechaFin}" class="form-control pickerDates" autocomplete="off" required> -->
										<input type="date" id="fechaFinal" name="fechaFinal"
											min="2018-01-01" th:attr="max=${fechaFinal}"
											class="form-control pickerDates" autocomplete="off"
											style="color: rgb(73, 80, 87);"> <label
											for="fechaFinal" class="active">Fecha final</label>
									</div>
								</div>
								<!-- Btn Consultar -->
								<div class="col-sm-12 col-md-6 col-lg-2 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div>
										<!-- TODO: -->
										<button th:href="@{/rebateUsuario/consult}" id="btn-consultar"
											type="submit"
											class="btn btn-outline-primary btn-sm btn-xs-block btn-sm-block waves-effect">Consultar</button>
									</div>
								</div>
							</div>
						</div>
						<!-- ROW 2 -->
						<div class="col-md-12">
							<div class="form-row">
								<!-- Tipo periodo search -->
								<div class="col-lg-3 select-outline colis">
									<select id="idCatProgramaPago"
										name="programaPago.idCatProgramaPago"
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value="" disabled selected>Seleccionar tipo de período</option>
										<option value="">Cualquier período</option>
										<option th:each="tipo: ${tiposPeriodo}"
											th:value="${tipo.programaPago}"
											th:text="${tipo.idCatProgramaPago + ' - ' + tipo.programaPago}">
										</option>
									</select> <label>Tipo período</label>
								</div>
								<!-- Tipo rebate search -->
								<div class="col-lg-3 select-outline colis">
									<select id="tipoRebate" name="tipoRebate"
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value=0 disabled selected>Seleccionar tipo de rebate</option>
										<option value=0>Cualquier rebate</option>
										<option th:each="rebate: ${rebates}"
											th:value="${rebate.idCatTipoRebate}"
											th:text="${rebate.idCatTipoRebate + ' - ' + rebate.tipoRebate}"></option>
									</select> <label>Tipo rebate</label>
								</div>

								<div class="col-sm-12 col-md-2 col-lg-4 colis"></div>								

								<!-- Btn Descargar Reporte Usuario -->
								<div class="col-sm-12 col-md-6 col-lg-2 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div id="divVisible" class="">
										<a th:href="@{/rebateUsuario/report}" id="btn-download"
											type="button"
											class="btn btn-sodimac btn-sm btn-xs-block btn-sm-block waves-effect">Reporte usuario</a>
									</div>
								</div>
							</div>
						</div>
						<!--Grid column-->
						<div id="fragmentDiv" th:include="fragments/rebateUsuario :: start"
							class="col-md-12 py-3"></div>

					</div>
				</div>
			</div>
		</form>
	</section>

	<!-- Footer -->
	<footer th:insert="fragments/footer :: footer-principal"
		class="page-footer font-small grey lighten-5 fixed-bottom"> </footer>

	<!-- Script section -->
	<script type="text/javascript" th:src="@{/js/jquery-3.4.1.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/popper.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/mdb.js}"></script>
	<script type="text/javascript" th:src="@{/js/rebateUsuario.js}"></script>
	<script type="text/javascript" th:src="@{/js/addons/datatables.min.js}"></script>
	<script type="text/javascript" th:src="@{/js/sweetalert2.all.min.js}"></script>
	<script th:inline="javascript" th:if="${code == true}">
   		 /*<![CDATA[*/
   		 
    		var titulo = /*[[${titulo}]]*/ 'default';
    		var message = /*[[${msg}]]*/ 'default';
    		var tipo = /*[[${tipo}]]*/ 'default';
    		
    		if(tipo == 1){
    					
    			toastr.success(message, titulo);
    		}else if(tipo == 2){
    					
    			toastr.warning(message, titulo);
    		}else if(tipo == 3){
    						
    			toastr.error(message, titulo);
    		}
    		
   		 /*]]>*/
	</script>
	<script th:inline="javascript" th:if="${code == false}">
   		 /*<![CDATA[*/
   		 	console.log('Entra aqui');
    		var titulo = /*[[${titulo}]]*/ 'default';
    		var message = /*[[${msg}]]*/ 'default';
    		var tipo = /*[[${tipo}]]*/ 'default';
    		
    		console.log(titulo);
    		console.log(message);
    		console.log(tipo);
    		
    		if(tipo == 1){
    					
    			toastr.success(message, titulo);
    		}else if(tipo == 2){
    					
    			toastr.warning(message, titulo);
    		}else if(tipo == 3){
    						
    			toastr.error(message, titulo);
    		}
    		
   		 /*]]>*/
	</script>
	<script>
  	
    	$( document ).ready(function() {
    
    		// Clean notify message
			toastr.clear();

			var message = "[[${message}]]";
			if(message) {
				toastr.warning(message,"Advertencia");
			}
    		
      		$('.mdb-select').materialSelect();
      		$('.select-create').materialSelect();
      		$('.select-wrapper.md-form.md-outline input.select-dropdown').bind('focus blur', function () {
      			$(this).closest('.select-outline').find('label').toggleClass('active');
      			$(this).closest('.select-outline').find('.caret').toggleClass('active');
      		});
      		
      		// Validate fields
			$("#descripcion-periodo").keyup(function() {
				var $th = $(this);
				$th.val($th.val().replace(/[^A-Za-z0-9Ññ ]/g, function(str) {
					toastr.warning("Solo se permiten números y letras (0-9)(Aa-Zz, Ññ)");
					return '';
				}));
			});
      		
      		// Submit form consult
      		$("form#rebateUsuario").submit(function(e) {
    			// Stop default form Submit.
    			e.preventDefault();
    				
    			// Call Ajax Submit.
        		ajaxSubmitFormConsult();
			});
			
			
			
			$('#btn-download').prop('disabled', true);
			
			$('#divVisible').hide();
			
     });

  </script>

</body>
</html>
