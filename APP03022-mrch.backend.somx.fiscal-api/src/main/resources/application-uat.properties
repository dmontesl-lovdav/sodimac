# ===============================
# CONFIGURACIÓN PARA UAT
# ===============================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# SECURITY CONFIGURATION
security.enabled=${FINANZAS_JWT_ENABLED:false}

pac.detecno.name=DETECNO
pac.carbajal.name=CARBAJAL

# DATABASE CONFIGURATION — k8s usa DATASOURCE_* (no DB_*)
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=tenant_fiscal

# LOGGING LEVEL
logging.level.root=WARN
logging.level.Console=WARN
logging.level.com.sodimac=INFO

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# UTILS API — k8s usa UTILS_API_URL (con S)
utils.api.url=${UTILS_API_URL:http://utils-api:8080/api}
