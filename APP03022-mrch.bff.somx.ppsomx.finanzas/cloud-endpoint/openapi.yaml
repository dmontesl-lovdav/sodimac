      operationId: getFinanzasPaymentHeaderWithDetails
      produces:
        - application/json
      parameters:
        - name: paymentHeaderUuid
          in: path
          required: true
          description: Payment header UUID
          type: string
          format: uuid
        - name: pageNumber
          in: query
          required: false
          description: Page number
          type: integer
          default: 1
        - name: pageSize
          in: query
          required: false
          description: Page size
          type: integer
          default: 20
      responses:
