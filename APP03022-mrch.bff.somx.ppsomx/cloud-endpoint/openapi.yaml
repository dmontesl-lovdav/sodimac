        description: Catalog `id`. This is the refered value.
        example: 11
        format: int32
        type: integer
      type:
        description:
          "    Type of family. Available known values are:\n    - 1. Business Units.\n    - 2. Countries.\n   \
          \ - 3. Systems (modules).\n    - 4. Request reasons.\n    - 5. Request details.\n    - 11. Task kanban columns.\n\
          \    - 12. Task progress.\n    - 13. Task priority.\n    - 14. Task repetitiveness.\n"
        example: 1
        format: int32
        type: integer
    type: object
  CommentDto:
