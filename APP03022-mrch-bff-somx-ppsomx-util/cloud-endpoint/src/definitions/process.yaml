ProcessDto:
  type: object
  properties:
    idProcess:
      type: integer
      format: int32
      description: Unique identifier
    name:
      type: string
      description: Process name
    description:
      type: string
      description: Process description
    createdBy:
      type: integer
      format: int64
      description: User who created the record
    createdAt:
      type: string
      format: date-time
    updatedBy:
      type: integer
      format: int64
      description: User who last updated the record
    updatedAt:
      type: string
      format: date-time

CreateProcessDto:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    description:
      type: string
    createdBy:
      type: integer
      format: int64

UpdateProcessDto:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    updatedBy:
      type: integer
      format: int64

ProcessListResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: array
      items:
        $ref: "#/ProcessDto"
    count:
      type: integer
      format: int32

ProcessSingleResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      $ref: "#/ProcessDto"

ProcessDeleteResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: Proceso eliminado exitosamente
