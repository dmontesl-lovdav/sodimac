swagger: "2.0"
info:
  contact:
    email: jrcastillo@falabella.cl
    name: Arquitectura Falabella Tecnologia Corp.
  description:
    "Support RESTful operations for finanzas flow. This BFF provides access to
    financial operations including accounts payable, rebates, fiscal payments,
    shipping guides, and vendor management."
  title: Finanzas BFF API
  version: 2.0.0
  x-business-acronym: mrch
  x-capability-acronym: finanzas
  x-consumer-segments: retail
  x-service-name: finanzas
host: ${DOMAIN_OPENAPI}
schemes:
  - https
paths:
  # ==================== ACCOUNTS PAYABLE ====================
  /accounts-payable:
    get:
      tags:
        - accounts-payable
      summary: List accounts payable
      operationId: listAccountsPayable
      produces:
        - application/json
      parameters:
        - name: status
          in: query
          required: false
          description: Status code (e.g. 1=open, 2=closed)
          type: integer
          format: int32
        - name: vendorNumber
          in: query
          required: false
          description: Vendor number identifier
          type: integer
          format: int32
      responses:
        "200":
          description: List of accounts payable
          schema:
            type: array
            items:
              $ref: "#/definitions/AccountsPayableDto"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      security:
        - bearerAuth: []
    post:
      tags:
        - accounts-payable
      summary: Create account payable
      operationId: createAccountPayable
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CreateAccountsPayableDto"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/AccountsPayableDto"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      security:
        - bearerAuth: []

  /accounts-payable/{uuid}:
    get:
      tags:
        - accounts-payable
      summary: Get account payable by ID
      operationId: getAccountPayableById
      produces:
        - application/json
      parameters:
        - name: uuid
          in: path
          required: true
          description: Account payable UUID
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Found
          schema:
            $ref: "#/definitions/AccountsPayableDto"
        "404":
          description: Not found
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      security:
        - bearerAuth: []
    patch:
      tags:
        - accounts-payable
      summary: Update account payable
      operationId: updateAccountPayable
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: uuid
          in: path
          required: true
          description: Account payable UUID
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/UpdateAccountsPayableDto"
      responses:
        "200":
          description: Updated
          schema:
            $ref: "#/definitions/AccountsPayableDto"
        "404":
          description: Not found
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "500":
          description: Internal error
          schema:
            $ref: "#/definitions/ExceptionWrapper"
      security:
        - bearerAuth: []
    delete:
      tags:
        - accounts-payable
      summary: Delete account payable
      operationId: deleteAccountPayable
      produces:
        - application/json
      parameters:
        - name: uuid
          in: path
          required: true
          description: Account payable UUID
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          schema:
            $ref: "#/definitions/ExceptionWrapper"
        "401":
          description: Unauthorized
          schema:
