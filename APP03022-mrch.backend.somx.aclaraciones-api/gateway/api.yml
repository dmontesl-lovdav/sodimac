      operationId: postRequest
      parameters:
        - name: Authorization
          in: header
          description: KeyCloack OAuth2 token.
          required: true
          example: Bearer XXXXXXXXX
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDto"
        required: true
      responses:
        "200":
          description: Given request (aclaración) has been successfully created.
          content:
            "*/*":
              schema:
                type: integer
                format: int32
        "401":
          description: The request requires user authentication.
