spring.application.name=fiscal-api
server.port=${SERVER_PORT:8082}

# Aumentar tamaño máximo de headers (para tokens grandes)
server.max-http-request-header-size=32KB
server.tomcat.max-http-header-size=65536

# Definicion de los nombres de los PACs disponibles
pac.detecno.name=DETECNO
pac.carbajal.name=CARBAJAL

# PERFIL POR DEFECTO (dev = sin seguridad)
spring.profiles.active=${ENV_DEV:dev}

server.servlet.context-path=/

# SECURITY CONFIGURATION (por defecto deshabilitada para dev)
security.enabled=${FINANZAS_JWT_ENABLED:false}

# DATABASE  ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none

# PostgreSQL (prod / local)
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://10.138.153.10:5432/userapp?currentSchema=tenant_fiscal}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:Sodim@cP0str3s}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ACTUATOR ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.info.env.enabled=true

# LOGGING
logging.level.root=INFO
logging.level.Console=INFO
logging.level.com.sodimac=DEBUG
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=./app.log
logging.file.max-size=2MB
logging.file.max-history=5

# SECURITY - LOCAL VALUES FROM .ENV
fiscal.jwt.signing.
fiscal.jwt.role.operador=operadores
fiscal.jwt.role.proveedor=proveedores
fiscal.jwt.header=Authorization

# SWAGGER
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs

# PAGINATION CONFIGURATION
fiscal-api.pagination.default-page-size=${PAGINATION_DEFAULT_SIZE:20}
fiscal-api.pagination.max-page-size=${PAGINATION_MAX_SIZE:100}

# CATALOGOS API CONFIGURATION
# Cuando enabled=true, consulta catalogos-api para mensajes multi-idioma
# Cuando enabled=false, usa el mensaje fallback del enum
catalogs.api.enabled=${CATALOGS_API_ENABLED:false}
catalogs.api.url=${CATALOGS_API_URL:http://catalogos-api:8080}
catalogs.api.lang=${CATALOGS_API_LANG:1}

# STATUS TRAIN API CONFIGURATION (STM-1166)
# Servicio centralizado para validación de transiciones de estatus
status-train.api.enabled=${STATUS_TRAIN_API_ENABLED:true}
status-train.api.url=${STATUS_TRAIN_API_URL:http://localhost:8083}
status-train.api.timeout-ms=${STATUS_TRAIN_API_TIMEOUT:5000}
