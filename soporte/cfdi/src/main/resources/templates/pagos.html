<body>

	<!-- Header -->
	<header th:insert="fragments/header :: header-principal" id="header">

	</header>

	<!-- Start your project here-->
	<section class="mt-5 animated fadeIn">
		<div class="mask rgba-gradient">
			<div class="container h-100 mt-5 mb-5">

	                                 <div class="text-center">
	                                 	<div id="spinner" class="hide loading"></div>
	                                 </div>

				<!--Grid row-->
				<div class="row pt-5 mt-5">

					<!--Grid column-->
					<div th:include="fragments/pagoList :: fragmentStart" id="fragmentDiv" class="col-md-10">
					</div>
					<!--Grid column-->


		            <div class="col-md-2">
		                <div class="card">
		                    <div class="card-body">
		                        <div class="row m-b-0">

		                            <div class="col-12 col-sm-12 col-md-12" id="date-container">
		                                <div class="input-daterange input-group" id="datepicker">
		                                    <div class="form-group w-100">
		                                        <input type="text" id="dateDesde" class="input-sm form-control w-100 full" autocomplete="off" name="start" 
		                                        placeholder="dd/mm/aaaa" data-date-format="dd/mm/yyyy" tabindex="2" onblur="isValidDate('dateDesde', 'date_desde_validation', 'dateHasta', 'date_hasta_validation')">
		                                        <label for="·" class="control-label">
		                                            <span class="text-danger">*</span>Desde:
		                                        </label>
		                                        <div  id="date_desde_validation">
		                                        </div>
		                                    </div>
		                                </div>
		                            </div>
	
		                            <div class="col-12 col-sm-12 col-md-12" id="date-container">
		                                <div class="input-daterange input-group" id="datepicker">
		                                    <div class="form-group w-100">
		                                        <input type="text" id="dateHasta" class="input-sm form-control w-100 full" autocomplete="off" name="end" data-date-format="dd/mm/yyyy"
		                                         tabindex="3" onblur="isValidDate('dateDesde', 'date_desde_validation','dateHasta', 'date_hasta_validation')">
		                                        <label for="·" class="control-label">
		                                            <span class="text-danger">*</span>Hasta:
		                                        </label>
		                                        <div  id="date_hasta_validation">
		                                        </div>
		                                    </div>
		                                </div>
		                            </div>
		                            
		                            <div class="col-12 col-sm-12 col-md-12 m-b-25">
		                                <div class="txt-assist m-neutralize-form-group2">
		                                    Rango de fechas entre los que se buscarán los pagos <strong>( dd/mm/yyyy )</strong>
		                                </div>
		                            </div>
		                            
		                        </div><!-- /.row -->
		                        
		                        <div class="row">
		                            <div class="col-12 col-sm-12 col-md-12 m-b-25">
		                                <div class="form-group m-b-0">
		                                    <input id="montoInput" value="" type="text" class="form-control" maxlength="19" onkeypress="montoInput_onkeypress();" onblur="releaseEventMontoInputEmpty();" autocomplete="off"  tabindex="1">
	
		                                    <label for="montoInput" class="control-label">
		                                        Monto:
		                                    </label>
		                                    <div>
		                                        <div class="col-12" id="montoInput_validation">
		                                        </div>
		                                    </div>
		                                    <div class="txt-assist">
		                                        Ejemplo: 450.12
		                                    </div>
		                                </div><!-- /.form-group -->
		                            </div>
		                        </div>

		                        <div class="row">
		                            <div class="col-12 col-sm-12 col-md-12 m-b-25">
		                                <div class="form-group m-b-0">
											<select id="listEstatusPagos" class="btn btn-light text-left w-100">
											</select>		                                
		                                </div>
		                            </div>    
		                        </div>

	                            <div class="row m-t-0 m-b-0 ">
	                                <div class="col-10 text-left ">
	                                	<span class="title-2 m-b-0 "><span class="text-danger" style="font-size: 1.5rem; vertical-align: middle;">*</span> Campos obligatorios</span>
	                                </div>
	                            </div>
		                        
		                        <div class="row text-center">
		                        	 <div class="col-12 col-sm-12 col-md-12">
		                                <button id="btnBuscarPagos" type="button" class="btn btn-primary btn-block" onclick="consultarOnClick()" tabindex="1">
		                                    Consultar
		                                </button>
		                            </div>
			                        <div id="messages_consultas_multiples" style="margin-left: 20px;">
			                        </div>
		                        </div>                        
		                        
		                        
		                        <div class="row text-center" style="padding-top: 5%;">
		                        	 <div class="col-12 col-sm-12 col-md-12">
		                                <button id="btnDescargaxlsx" type="button" class="btn btn-primary btn-block" style="padding-left: 0 !important; padding-right: 0 !important;" onclick="descargaxlsxOnClick()" tabindex="1">
		                                    Exportar a Excel
		                                </button>
		                            </div>
			                        <div id="messages_consultas_multiples" style="margin-left: 20px;">
			                        </div>
		                        </div>
	
		                    </div><!-- /.card-body -->
		                </div><!-- /.card -->
		            </div><!-- /.col-12 -->


				</div>
				<!--Grid row-->

			</div>
		</div>
		
		<div class="modal" tabindex="-1" id="modalDescargarExcelPagos">
		  <div class="modal-dialog">
		    <div class="modal-content">
		      <div class="modal-header">
		      	<h4 class="modal-title" th:text="#{PAGOS.TITULO}"></h4>
		        <button type="button" class="close" data-dismiss="modal">&times;</button>
		      </div>
		      <div class="modal-body">
		        <div id="divWarningExcelPagos" class="alert alert-warning"></div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-primary" data-dismiss="modal">
		        	<i class="fa fa-floppy-o"></i> <span th:text="#{COMUN.ACEPTAR}"></span>
                </button>
		      </div>
		    </div>
		  </div>
		</div>

		<div class="modal fade modal-pdf-viewer" tabindex="-1" role="dialog" id="divModalPDF">
		    <div class="modal-dialog modal-lg modal-xl mt-2" role="document" >
		        <div class="modal-content mt-0">
		            <div class="modal-header p-0">
		                <h5 class="titulo-left-modal">Ver documento <span id="uuid-pdf"></span></h5>
		                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
		                    <span aria-hidden="true">&times;</span>
		                </button>
		            </div>
		            <div class="modal-body p-0">
		                <div id="divAjaxPDF">
		                    <iframe id="FramePDF" src="" style="border: 1px solid black; width:100%; height:500px"></iframe>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
		
		<div class="modal" tabindex="-1" id="modalValidar">
		  <div class="modal-dialog">
		    <div class="modal-content">
		      <div class="modal-header">
		      	<h4 class="modal-title" th:text="#{PAGOS.TITULO}"></h4>
		        <button type="button" class="close" data-dismiss="modal">&times;</button>
		      </div>
		      <div class="modal-body">
		        <div id="divWarning" class="alert alert-warning"></div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-primary" data-dismiss="modal">
		        	<i class="fa fa-floppy-o"></i> <span th:text="#{COMUN.ACEPTAR}"></span>
                </button>
		      </div>
		    </div>
		  </div>
		</div>
		
		<div class="modal" tabindex="-1" id="modalConfirmar">
		  <div class="modal-dialog">
		    <div class="modal-content">
		      <div class="modal-header">
		      	<h4 class="modal-title" th:text="#{PAGOS.TITULO}"></h4>
		        <button type="button" class="close" data-dismiss="modal">&times;</button>
		      </div>
		      <div class="modal-body">
		        <div id="divWarningConfirmar" class="alert alert-warning"></div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-danger" data-dismiss="modal" onclick="cancelarEditNumeroCuenta()">
                    <i class="fa fa-times"></i> <span th:text="#{COMUN.CANCELAR}"></span>
                </button>
                <button type="button" class="btn btn-primary" id="btn-generar-folio" onclick="modificarfolioClienteConfirm()">
                    <i class="fa fa-floppy-o"></i> <span th:text="#{COMUN.GUARDAR}"></span>
                </button>
		      </div>
		    </div>
		  </div>
		</div>


		<div class="modal pullDown" id="responsive2" tabindex="-1" role="dialog" aria-hidden="true">
		    <div class="modal-dialog modal-lg" role="document">
		        <div class="modal-content">
		            <div class="modal-header">
		                <h5 class="modal-title" id="responsivemodal">Reenvío de correo</h5>
		                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
		                    <i class="ti-close"></i>
		                </button>
		            </div>
		            <div class="modal-body">
		                <div class="row">
		                    <div class="col-12">
		                        <form id="reenvioMail">
		                            <div class="form-group">
		                            	<input type="hidden" id="uuid" class="uuid" value=""/>
		                            	<input type="hidden" id="rfcReenvio" value=""/>
		                                <input type="text" class="form-control" id="correo_electronico_anterior" name="correo_electronico_anterior" readonly autocomplete="off">
		                                <label for="correo_electronico_anterior" class="">
		                                    <span class="text-danger">*</span>Correo electrónico:
		                                </label>
		                                <div>
		                                    <div id="correo_electronico_anterior_validation"></div>
		                                </div>
		                            </div>
		                            <div class="form-group">
		                                <input type="text" class="form-control " id="correo_electronico_nuevo" name="correo_electronico_nuevo" maxlength="50" autocomplete="off">
		                                <label for="correo_electronico_nuevo" class="">
		                                    <span class="text-danger">*</span>Con copia para:
		                                </label>
		                                <div>
		                                    <div id="correo_electronico_nuevo_validation"></div>
		                                </div>
		                            </div>
		                            <div class="">
		                                <div class="col text-right px-0">
		                                    <button type="button" id="enviarUserDate" onClick="reenviarFactura()" class="btn btn-primary">Enviar</button>
		                                </div>
		                            </div>
		
		                        </form>
		                    </div>
		                </div>
		            </div>
		            <!-- /.modal-body-->
		        </div>
		        <!-- /.modal-content-->
		    </div>
		    <!-- /.modal-dialog-->
		</div>


	</section>
	<!-- /.Start your project here-->

	<!-- Footer -->
	<footer th:insert="fragments/footer :: footer-principal" class="page-footer font-small grey lighten-5 fixed-bottom">

	</footer>

<!-- Script section -->
<script type="text/javascript" charset="UTF-8" th:src="@{/js/ajaxPagos.js}"></script>
<script type="text/javascript" charset="UTF-8" th:src="@{/js/pagos.js}"></script>
<script type="text/javascript" charset="UTF-8" th:src="@{/js/variables.js}"></script>
<script>
		
		$(document).ready(function() {
		
			// Clean notify message
			toastr.clear();
			// Styles for navigation bar.
			$(".nav-item").removeClass("active");
			$(".dropdown-item").removeClass("active");
			$("#navPagos").addClass("active");
			
		});
		
	</script>
<!-- /.Script section -->

</body>

</html>
