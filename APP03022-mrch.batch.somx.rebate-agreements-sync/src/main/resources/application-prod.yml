spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST:10.138.153.10}:${DB_PORT:1433};databaseName=${DB_NAME:SODIMAC_SAP_PROD};encrypt=true;trustServerCertificate=false;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.rebatesync: INFO
    org.springframework.web: WARN

# Production-specific Rebate Sync Configuration
rebate:
  sync:
    cron: "0 0 3 * * ?"  # Every day at 03:00 AM Mexico City time

  external:
    api:
      contracts-url: ${REBATE_API_CONTRACTS_URL}
      agreements-url: ${REBATE_API_AGREEMENTS_URL}
      timeout: ${REBATE_API_TIMEOUT:120000}

# For batch/control tables
batch:
  datasource:
    url: jdbc:sqlserver://${BATCH_DB_HOST}:${BATCH_DB_PORT:1433};databaseName=${BATCH_DB_NAME:SODIMAC_BATCH_PROD};encrypt=true;trustServerCertificate=false;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
    username: ${BATCH_DB_USERNAME}
    password: ${BATCH_DB_PASSWORD}
