definitions:
  ExceptionWrapper:
    properties:
      code:
        description: Numeric HTTP Status error
        example: 401
        format: int32
        type: integer
      message:
        description: Error description
        example: Unauthorized
        type: string
    type: object

  FiscalXmlResponse:
    type: object
    properties:
      success:
        type: boolean
      documentType:
        type: string
      comprobante:
        type: object
      emisor:
        type: object
      receptor:
        type: object
      timbreFiscalDigital:
        type: object

  InvoiceDto:
    type: object
    properties:
      id:
        type: integer
        format: int64
      folio:
        type: string
      serie:
        type: string
      fecha:
        type: string
        format: date-time
      total:
        type: number
        format: double
      subtotal:
        type: number
        format: double
      uuid:
        type: string
      rfcEmisor:
        type: string
      rfcReceptor:
        type: string
      moneda:
        type: string
      tipoComprobante:
        type: string

  InvoiceStatusUpdateRequest:
    type: object
    required:
      - numeroProveedor
      - estatusOrigen
      - estatusDestino
      - idUsuarioActualizacion
    properties:
      numeroProveedor:
        type: number
        description: Numero de proveedor
      estatusOrigen:
        type: integer
        description: Estatus actual del documento
      estatusDestino:
        type: integer
        description: Nuevo estatus deseado
      idUsuarioActualizacion:
        type: integer
        format: int64
        description: ID del usuario que realiza la actualizacion
      fechaContabilizacion:
        type: string
        format: date
        description: Fecha de contabilizacion (solo si estatusDestino = 7)
      comentario:
        type: string
        description: Comentario o motivo del cambio

  InvoiceStatusUpdateResponse:
    type: object
    properties:
      success:
        type: boolean
      code:
        type: string
      message:
        type: string
      invoiceUuid:
        type: string
        format: uuid
      fiscalUuid:
        type: string
        format: uuid
      documentType:
        type: string
      estatusAnterior:
        type: integer
      estatusNuevo:
        type: integer
      estatusNuevoNombre:
        type: string
      fechaContabilizacion:
        type: string
        format: date
      fechaActualizacion:
        type: string
        format: date-time

  InvoiceUpdateDto:
    type: object
    properties:
      id:
        type: integer
        format: int64
      status:
        type: string

  InvoiceSearchDto:
    type: object
    properties:
      uuid:
        type: string
      rfcEmisor:
        type: string
      rfcReceptor:
        type: string
      fechaInicio:
        type: string
        format: date
      fechaFin:
        type: string
        format: date
      page:
        type: integer
        default: 0
      size:
        type: integer
        default: 20

  BulkDownloadRequest:
    type: object
    required:
      - invoiceUuids
    properties:
      invoiceUuids:
        type: array
        description: Lista de UUIDs de facturas/NC a descargar
        items:
          type: string
          format: uuid
      documentType:
        type: string
        description: Tipo de documento (I=Factura, E=NC). Opcional, si no se especifica descarga ambos tipos

