# ============================================================
# SonarQube - Fiscal SPA
# ============================================================

sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

# ============================================================
# Archivos productivos analizados
#
# Este alcance permite controlar:
# - cobertura
# - complejidad cognitiva
# - duplicaciones
# - issues
#
# sin afectar el build ni el funcionamiento de la aplicación.
#
# Debe mantenerse en sincronía con `collectCoverageFrom` en
# jest.config.js: solo archivos respaldados por pruebas reales.
# ============================================================

sonar.inclusions=\
src/shared/components/ui/modal/GenericModal.tsx,\
src/shared/components/ui/navigation/Breadcrumb.tsx,\
src/shared/components/ui/misc/GenericTrace.tsx,\
src/shared/components/ui/input/GenericInput.tsx,\
src/shared/components/ui/attachmentUploader/attachmentHelpers.ts,\
src/shared/security/securityService.ts,\
src/shared/security/useSecurityContext.ts,\
src/features/home/services/versionCatalogService.ts,\
src/features/creditNote/parts/publishQuery.ts,\
src/features/creditNote/parts/parseValidatedXml.ts,\
src/features/creditNote/utils/resolveXmlValidationCommand.ts,\
src/features/creditNote/utils/publishCreditNoteResponse.ts

# ============================================================
# Pruebas unitarias
# ============================================================

sonar.test.inclusions=\
src/**/__tests__/**,\
src/**/*.test.ts,\
src/**/*.test.tsx,\
src/**/*.test.js,\
src/**/*.test.jsx,\
src/**/*.spec.ts,\
src/**/*.spec.tsx,\
src/**/*.spec.js,\
src/**/*.spec.jsx

# Evita considerar pruebas y mocks como código productivo
sonar.exclusions=\
src/**/__tests__/**,\
src/**/*.test.*,\
src/**/*.spec.*,\
src/test/**,\
src/**/*.d.ts

# ============================================================
# Cobertura Jest
# ============================================================

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.inclusions=\
src/shared/components/ui/modal/GenericModal.tsx,\
src/shared/components/ui/navigation/Breadcrumb.tsx,\
src/shared/components/ui/misc/GenericTrace.tsx,\
src/shared/components/ui/input/GenericInput.tsx,\
src/shared/components/ui/attachmentUploader/attachmentHelpers.ts,\
src/shared/security/securityService.ts,\
src/shared/security/useSecurityContext.ts,\
src/features/home/services/versionCatalogService.ts,\
src/features/creditNote/parts/publishQuery.ts,\
src/features/creditNote/parts/parseValidatedXml.ts,\
src/features/creditNote/utils/resolveXmlValidationCommand.ts,\
src/features/creditNote/utils/publishCreditNoteResponse.ts

sonar.coverage.exclusions=\
src/**/__tests__/**,\
src/**/*.test.*,\
src/**/*.spec.*,\
src/test/**,\
src/**/*.d.ts,\
src/**/*.css

# ============================================================
# Duplicaciones
# ============================================================

sonar.cpd.exclusions=src/**
