batch=false

# Descarga por periodos (chunked). Alternativa opt-in: NO altera los flujos existentes.
# enabled=false -> comportamiento original (batch / API parametros). enabled=true -> descarga el rango
# partido en bloques de N dias para evitar el timeout de una sola llamada de rango grande.
# --- Modo diario (produccion): ventana movil de N dias hacia atras, recalculada cada corrida ---
# Dejar enabled=true para el diario. El indice unico hace inofensiva la re-carga del solapamiento.
descarga.ultimos-dias.enabled=true
descarga.ultimos-dias.cantidad=30

# --- Modo backfill manual: rango fijo. Tiene prioridad sobre ultimos-dias cuando enabled=true ---
# Dejar enabled=false en produccion. Encender solo para cargar un rango historico puntual.
descarga.periodo.enabled=false
descarga.periodo.fechaInicio=2026/01/01
descarga.periodo.fechaFin=2026/01/31
descarga.periodo.dias-por-bloque=7
