info:
  contact:
    email: jrcastillo@falabella.cl
    name: Arquitectura Falabella Tecnologia Corp.
  description: >
    Support RESTful operations for utils flow. This API provides access to
    parameters, modules, messages, application messages, processes, item types,
    items, shared catalogs, suppliers, supplier blocks, status train,
    conversions and catalog layout validation.
  title: Utils API
  version: 2.0.0
  x-business-acronym: mrch
  x-capability-acronym: utils
  x-consumer-segments: retail
  x-service-name: utils

