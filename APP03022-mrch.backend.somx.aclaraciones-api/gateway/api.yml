          content:
            "*/*":
              schema:
                type: string
      security:
        - bearerAuth: []
    put:
      tags:
        - faq-controller
      summary: Actualiza la pregunta frecuente
      operationId: updateFaq
      parameters:
        - name: id
          in: path
          required: true
          schema:
