ItemDto:
  type: object
  properties:
    idItem:
      type: integer
      format: int32
      description: Unique identifier
    name:
      type: string
      description: Item name
    description:
      type: string
      description: Item description
    createdBy:
      type: integer
      format: int64
      description: User who created the record
    createdAt:
      type: string
      format: date-time
    updatedBy:
      type: integer
      format: int64
      description: User who last updated the record
    updatedAt:
      type: string
      format: date-time

CreateItemDto:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    description:
      type: string
    createdBy:
      type: integer
      format: int64

UpdateItemDto:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    updatedBy:
      type: integer
      format: int64

ItemListResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: array
      items:
        $ref: "#/ItemDto"
    count:
      type: integer
      format: int32

ItemSingleResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      $ref: "#/ItemDto"

ItemDeleteResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: Elemento eliminado exitosamente
