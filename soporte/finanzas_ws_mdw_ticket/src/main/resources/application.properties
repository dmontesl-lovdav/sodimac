server.servlet.context-path=/wsmdlwticket
server.port=8088
cxf.path=/

# Perfil activo: dev o prod
spring.profiles.active=dev

# NOTA IMPORTANTE: Las siguientes propiedades solo aplican cuando se ejecuta con Tomcat embebido.
# Si despliegas el WAR en un Tomcat externo (Tomcat 9), debes configurar los timeouts en:
# $CATALINA_HOME/conf/server.xml
# Ver archivo CONFIGURACION_TOMCAT.md para instrucciones detalladas.

# Configuración de timeouts para operaciones largas (procedimientos almacenados)
# El procedimiento PKG_FACTURA_UNITARIA puede tardar hasta 90 segundos
# SOLO aplica en desarrollo con Tomcat embebido (mvn spring-boot:run)
server.connection-timeout=180000
server.tomcat.connection-timeout=180000

# Keep-alive para mantener la conexión activa durante operaciones largas
server.tomcat.keep-alive-timeout=180000
server.tomcat.max-keep-alive-requests=100