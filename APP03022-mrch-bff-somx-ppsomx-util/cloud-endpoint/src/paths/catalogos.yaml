        in: path
        required: true
        type: integer
        format: int32
    responses:
      "200":
        description: List of active elements
        schema:
          type: array
          items:
            $ref: "../definitions/catalog.yaml#/CatalogElementDto"
    security:
      - bearerAuth: []

catalogos-elementos-by-id:
  get:
    tags:
      - catalogos
    summary: Get element by ID
    operationId: getCatalogElementById
    produces:
      - application/json
    parameters:
      - name: catalogId
        in: path
        required: true
        type: integer
        format: int32
      - name: elementId
        in: path
        required: true
        type: integer
        format: int32
    responses:
      "200":
        description: Element
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementDto"
      "404":
        description: Not found
    security:
      - bearerAuth: []

  put:
    tags:
      - catalogos
    summary: Update element
    operationId: updateCatalogElement
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - name: catalogId
        in: path
        required: true
        type: integer
        format: int32
      - name: elementId
        in: path
        required: true
        type: integer
        format: int32
      - name: X-User-Id
        in: header
        required: false
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementUpdateDto"
    responses:
      "200":
        description: Updated
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementDto"
      "404":
        description: Not found
    security:
      - bearerAuth: []

catalogos-elementos-estatus:
  patch:
    tags:
      - catalogos
    summary: Change element status
    operationId: changeCatalogElementStatus
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - name: elementId
        in: path
        required: true
        type: integer
        format: int32
      - name: X-User-Id
        in: header
        required: false
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementStatusDto"
    responses:
      "200":
        description: Updated
        schema:
          $ref: "../definitions/catalog.yaml#/CatalogElementDto"
      "404":
        description: Not found
    security:
      - bearerAuth: []

catalogos-validate-layout:
  post:
    tags:
      - catalogos
    summary: Validate XLSX layout (multipart/form-data; body managed by BFF/backend, not validated here)
    description: |
      Endpoint que recibe un XLSX en multipart/form-data junto con los campos
      `tipoCatalogoSeleccionado` y `nombreCatalogo`. Cloud Endpoints no soporta
      uploads de archivos, por lo que el body no se describe aqui; el gateway
      solo enruta la peticion al BFF/util-api que se encarga del parseo.
    operationId: validateCatalogLayout
    produces:
      - application/json
    responses:
      "200":
        description: Validation result
        schema:
          $ref: "../definitions/catalog.yaml#/LayoutValidationResponse"
      "400":
        description: Invalid file or parameters
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

validation-reports:
  get:
    tags:
      - catalogos
    summary: Download validation error report
    operationId: getValidationReport
    produces:
      - text/plain
    parameters:
      - name: reportId
        in: path
        required: true
        type: string
    responses:
      "200":
        description: Text report
        schema:
          type: string
      "404":
        description: Report not found
    security:
      - bearerAuth: []

