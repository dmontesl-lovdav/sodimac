	<section class="mt-5 animated fadeIn">

					<!--Grid row-->

					<div class="form-row">Exclusiones OC</div>
						<!-- ROW 1 -->
						<div class="col-md-12 mt-1 mb-1">
							<div class="form-row">
								
								<!-- Folio -->
								<div class="col-lg-3 colis">
									<div class="md-form form-sm">
										<input type="text" id="txt-folio"
											name="folio" 
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off" /> 
										<label class="label-gcis" for="txt-folio">
											<i class="fa fa-search mr-2" style="opacity: .6;" aria-hidden="true"></i>
											Folio
										</label>
									</div>
								</div>
								
								<!-- Periodo -->
								<div class="col-lg-3 select-outline colis">
								
									<select id="periodo-idCatPeriodo" name="periodo.idCatPeriodo" required
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value=0>Cualquier período</option>
										<option th:each="periodoC: ${listPeriodos}"
											th:value="${periodoC.idCatPeriodo}" th:text="${periodoC.idCatPeriodo + ' - ' + periodoC.detallePeriodo + ' (' + periodoC.programaPago.programaPago + ')'}">
										</option>
									</select> <label>Id período</label>
								</div>
								
								<!-- Num Proveedor -->
								<div class="col-lg-3 colis">
									<div class="md-form form-sm">
										<input type="text" id="txt-proveedor"
											name="folio" 
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off" /> 
										<label class="label-gcis" for="txt-proveedor">
											<i class="fa fa-search mr-2" style="opacity: .6;" aria-hidden="true"></i>
											Número Proveedor
										</label>
									</div>
								</div>
								
								<!-- Btn Consultar -->
								<div class="col-sm-12 col-md-6 col-lg-3 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div class="">
										<button th:href="@{/exclusiones/consult}" id="btn-consultar"
											type="submit"
											class="btn btn-outline-primary btn-sm btn-xs-block btn-sm-block waves-effect">Consultar</button>
										<a class="btn btn-outline-primary btn-sm btn-xs-block btn-sm-block waves-effect" title="Limpiar filtros seleccionados" onclick="btnLimpiar()" >Limpiar</a>
									</div>
								</div>															
								
								
								<!-- Excepcion -->
								<div class="col-lg-3 colis">
									<div class="md-form form-sm">
										<input type="text" id="txt-exclusion"
											name="txt-exclusion" 
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off" /> 
										<label class="label-gcis" for="txt-exclusion">
											<i class="fa fa-search mr-2" style="opacity: .6;" aria-hidden="true"></i>
											Comentario Exclusi&oacute;n
										</label>
									</div>
								</div>
								
								<!-- Tipo Excepcion -->
								<div class="col-lg-3 select-outline colis">
								
									<select id="exclusion-idTipoExclusion" name="tipoExclusion.idTipoExclusion" required
										class="mdb-select md-form md-outline form-control-sm colorful-select dropdown-primary">
										<option value=0>Cualquier exclusi&oacute;n</option>
										<option th:each="exclusionC: ${listTipoExclusiones}"
											th:value="${exclusionC.idCatTipoExclusion}" th:text="${exclusionC.idCatTipoExclusion + ' - ' + exclusionC.descripcion}">
										</option>
									</select>
									<label>exclusi&oacute;n</label>
								</div>
								
								<!-- Num Proveedor -->
								<div class="col-lg-3 colis">
									<div class="md-form form-sm">
										<input type="text" id="txt-ordenCompra"
											name="folio" 
											class="form-control form-control-sm inputs-gcis"
											autocomplete="off" /> 
										<label class="label-gcis" for="txt-ordenCompra">
											<i class="fa fa-search mr-2" style="opacity: .6;" aria-hidden="true"></i>
											Orden Compra
										</label>
									</div>
								</div>
								
								<!-- Btn Agregar -->
								<div class="col-sm-12 col-md-6 col-lg-3 left-xs-0 colis"
									style="margin-top: 0px; position: relative; left: 10px;">
									<div class="">
										<a th:href="@{#}" id="btn-agregar" data-toggle="modal"
											data-target="#responsiveAddExclusion" data-backdrop="static"
											data-keyboard="false"
											class="btn btn-default btn-sm btn-xs-block btn-sm-block waves-effect">Agregar Exclusi&oacute;n</a>
									</div>
								</div>
								
								<div class="col-sm-12 col-md-2 col-lg-9 colis"></div>
								
								<div class="col-lg-3 select-outline colis"
									style="margin-top: 0px; position: relative; left: 10px;">
										<div id="divVisible" class="">
										<a th:href="@{/exclusiones/report}" id="btn-download"
											type="button"
											class="btn btn-sodimac btn-sm btn-xs-block btn-sm-block waves-effect">Reporte</a>
									</div>
								</div>
								
							</div>
						</div>
						
						<!--Grid column-->
						<div id="fragmentDiv" th:include="fragments/listExclusiones :: start" class="col-md-12 py-3"></div>
						
						<input type="hidden" id="hdIdCatTipoExclusionParent" />
						<input type="hidden" id="hdIdExclusionParent" />
						<input type="hidden" id="hdIdUserParent" th:value="${idUser}" />
						
					</div>
				</div>
			</div>

	<script>
  	
    $( document ).ready(function() {
    
		// Clean notify message
		toastr.clear();
    	
    	var message = "[[${message}]]";
		if(message) {
			toastr.warning(message,"Advertencia");
		}
    	
  		$('.mdb-select').materialSelect();
  		$('.select-create').materialSelect();
  		$('.select-wrapper.md-form.md-outline input.select-dropdown').bind('focus blur', function () {
  			$(this).closest('.select-outline').find('label').toggleClass('active');
  			$(this).closest('.select-outline').find('.caret').toggleClass('active');
  		});
  		
  		
  		var idCatTipoExclusionParent = $("#hdIdCatTipoExclusionParent").val();
  		var idExclusionParent = $("#hdIdExclusionParent").val();
  		
  		// Submit form consult
  		$("form#exclusiones").submit(function(e) {
			// Stop default form Submit.
			e.preventDefault();
				
			// Call Ajax Submit.
			ajaxSubmitFormConsult();
		});
		
		// Submit form create
		$("form#create-exclusion").submit(function(e) {
    		// Stop default form Submit.
    		e.preventDefault();
 
        	// Call Ajax Submit.
	      	ajaxSubmitForm();
		});
		
		// Submit form create
		$("form#form-create-exclusion-oc").submit(function(e) {
    		// Stop default form Submit.
    		e.preventDefault();
 
 			var form = this;
    		var table = $('#exclusion-oc-table').DataTable();
			var rows_selected = table.column(0).checkboxes.selected();

			// Iterate over all selected checkboxes
			$.each(rows_selected, function(index, rowId){
				// Create a hidden element
				$(form).append(
				$('<input>')
					.attr('type', 'hidden')
					.attr('name', 'id[]')
					.val(rowId)
				);
			});
			
			console.log(rows_selected.join(","));
			var jsonId = rows_selected.join(",");
 			
        	// Call Ajax Submit.
	      	ajaxSubmitOCDetForm(jsonId);
		});
		
		// Submit form create
		$("form#form-create-exclusion-familia").submit(function(e) {
    		// Stop default form Submit.
    		e.preventDefault();
 
 			var form = this;
    		var table = $('#exclusion-familia-table').DataTable();
			var rows_selected = table.column(0).checkboxes.selected();

			// Iterate over all selected checkboxes
			$.each(rows_selected, function(index, rowId){
				// Create a hidden element
				$(form).append(
				$('<input>')
					.attr('type', 'hidden')
					.attr('name', 'id[]')
					.val(rowId)
				);
			});
			
			console.log(rows_selected.join(","));
			var jsonId = rows_selected.join(",");
 			
        	// Call Ajax Submit.
	      	ajaxSubmitFamiliaDetForm(jsonId);
		});
		
		
		// Submit form create
		$("form#form-create-exclusion-sku").submit(function(e) {
    		// Stop default form Submit.
    		e.preventDefault();
    		
			var form = this;
    		var table = $('#exclusion-sku-table').DataTable();
			var rows_selected = table.column(0).checkboxes.selected();

			// Iterate over all selected checkboxes
			$.each(rows_selected, function(index, rowId){
				// Create a hidden element
				$(form).append(
				$('<input>')
					.attr('type', 'hidden')
					.attr('name', 'id[]')
					.val(rowId)
				);
			});
			
			console.log(rows_selected.join(","));
			var jsonId = rows_selected.join(",");
 
        	// Call Ajax Submit.
	      	ajaxSubmitSkuDetForm(jsonId);
		});
		
		$("form#form-create-exclusion-proveedor").submit(function(e) {
    		// Stop default form Submit.
    		e.preventDefault();
    		
    		var form = this;
    		var table = $('#exclusion-proveedor-table').DataTable();
			var rows_selected = table.column(0).checkboxes.selected();

			// Iterate over all selected checkboxes
			$.each(rows_selected, function(index, rowId){
				// Create a hidden element
				$(form).append(
				$('<input>')
					.attr('type', 'hidden')
					.attr('name', 'id[]')
					.val(rowId)
				);
			});
			
			console.log(rows_selected.join(","));
			var jsonId = rows_selected.join(",");
 
        	// Call Ajax Submit.
	      	ajaxSubmitProveedorDetForm(jsonId);
		});
		
		// Cancel button
		$( "#btn-resetExclusion" ).on( "click", function() {
		
			$("#txt-edit-exclusion").val("");
			$("#txt-edit-numProveedor").val("");
			$("#txt-comentario").val("");
			$("#archivo").val("");
			$("#layout").val("");
			$("#create-select-periodo").materialSelect('destroy');
			$("#create-select-periodo").val("").change();
			$("#create-select-periodo").materialSelect();
			$("#create-select-tipo-rebate").materialSelect('destroy');
			$("#create-select-tipo-rebate").val("").change();
			$("#create-select-tipo-rebate").materialSelect();
			$("#create-select-tipo-exclusion").materialSelect('destroy');
			$("#create-select-tipo-exclusion").val("").change();
			$("#create-select-tipo-exclusion").materialSelect();
			$('#responsiveAddExclusion').modal('hide');
		});
		
		// Modificar comentario 
		$( "#btn-comentario-exclusion" ).on( "click", function() {
		
			modificarComentarioExclusion ();			
		});

		// Cancel edit button
