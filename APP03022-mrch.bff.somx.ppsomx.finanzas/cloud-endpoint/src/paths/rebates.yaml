      - bearerAuth: []

rebates-by-uuid:
  get:
    tags: [rebates]
    summary: Get rebate by ID
    operationId: getRebateById
    produces: [application/json]
    parameters:
      - name: uuid
        in: path
        required: true
        description: Rebate UUID
        type: string
    responses:
      "200":
        description: Found
        schema:
          $ref: "../definitions/rebates.yaml#/RebateDto"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  put:
    tags: [rebates]
    summary: Update rebate
    operationId: updateRebate
    consumes: [application/json]
    produces: [application/json]
    parameters:
      - name: uuid
        in: path
        required: true
        description: Rebate UUID
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/rebates.yaml#/UpdateRebateDto"
    responses:
      "200":
        description: Updated
        schema:
          $ref: "../definitions/rebates.yaml#/RebateDto"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  delete:
    tags: [rebates]
    summary: Delete rebate
    operationId: deleteRebate
    produces: [application/json]
    parameters:
      - name: uuid
        in: path
        required: true
        description: Rebate UUID
        type: string
    responses:
      "204":
        description: Deleted
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

rebates-fiscal-detail:
  get:
    tags: [rebates]
    summary: Consultar detalle fiscal del descuento comercial
    description: >
      Obtiene los UUID fiscales relacionados y los datos de la nota de
      credito para mostrar UUID, fecha de registro, importe, serie y folio.
      El parametro uuid corresponde al UUID interno del descuento comercial.
      Cuando el descuento existe pero no tiene una nota de credito disponible,
      devuelve HTTP 200 con creditNotes vacio y un mensaje informativo.
    operationId: getRebateFiscalDetail
    produces: [application/json]
    parameters:
      - name: uuid
        in: path
        required: true
        type: string
        format: uuid
        description: UUID interno del descuento comercial (rebateId)
    responses:
      "200":
        description: Detalle fiscal del descuento comercial
        schema:
          $ref: "../definitions/rebates.yaml#/RebateFiscalDetailDto"
      "400":
        description: UUID del descuento comercial invalido
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "404":
        description: Descuento comercial no encontrado
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

rebates-purchase-order-details-sync:
  post:
    tags: [rebates]
    summary: Sincronizar las ordenes de compra de un descuento comercial
    description: >
      Localiza una cabecera existente por documentNumber, vendorNumber,
      source y periodId exactos, sin filtrar por estado.
      Guarda o reemplaza su detalle de ordenes dentro de una transaccion.
      No crea cabeceras ni modifica el importe, estado o nota de credito.
      Devuelve 404 si no existe la cabecera y 409 si hay varias coincidencias.
      No acepta una lista vacia de ordenes.
    operationId: syncRebatePurchaseOrderDetails
    consumes: [application/json]
    produces: [application/json]
    parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: "../definitions/rebates.yaml#/SyncRebatePurchaseOrderDetailsDto"
    responses:
      "200":
        description: Detalle de ordenes guardado
        schema:
          $ref: "../definitions/rebates.yaml#/SyncRebatePurchaseOrderDetailsResultDto"
      "400":
        description: Datos de sincronizacion invalidos
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "404":
        description: El descuento aun no existe en FBC
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "409":
        description: Varias cabeceras coinciden con la clave del descuento
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

rebates-purchase-order-details:
  get:
    tags: [rebates]
    summary: Consultar las ordenes de compra de un descuento comercial
    description: >
      Devuelve el ultimo detalle de ordenes sincronizado para el rebate.
      Incluye orden de compra, monto recibido, fecha de recepcion,
      tipo de descuento y monto de descuento.
      Si el descuento existe pero aun no tiene detalle sincronizado,
      devuelve HTTP 200 con orders vacio y un mensaje informativo.
    operationId: getRebatePurchaseOrderDetails
    produces: [application/json]
    parameters:
      - name: uuid
        in: path
        required: true
        type: string
        format: uuid
        description: UUID interno del descuento comercial (rebateId)
    responses:
      "200":
        description: Detalle de ordenes del descuento comercial
        schema:
          $ref: "../definitions/rebates.yaml#/RebatePurchaseOrderDetailsDto"
      "400":
        description: UUID del descuento comercial invalido
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "404":
        description: Descuento comercial no encontrado
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []
