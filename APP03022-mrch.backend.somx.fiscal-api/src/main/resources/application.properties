spring.application.name=fiscal-api
server.port=${SERVER_PORT:8082}

# Aumentar tamaño máximo de headers (para tokens grandes)
server.max-http-request-header-size=32KB
server.tomcat.max-http-header-size=65536

# Definicion de los nombres de los PACs disponibles
pac.detecno.name=DETECNO
pac.carbajal.name=CARBAJAL

# PERFIL POR DEFECTO (dev = sin seguridad)
spring.profiles.active=${ENV_DEV:dev}

server.servlet.context-path=/

# SECURITY CONFIGURATION (por defecto deshabilitada para dev)
security.enabled=${FINANZAS_JWT_ENABLED:false}

# DATABASE  ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none

# PostgreSQL
# DATASOURCE_URL  = k8s (URL completa inyectada por pipeline)
# DB_HOST/PORT/.. = local dev (partes individuales)
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:b2b_portal}?currentSchema=tenant_fiscal&ssl=${DB_SSL:false}}
spring.datasource.username=${DATASOURCE_USERNAME:${DB_USER:wwwb2bportal}}
spring.datasource.password=${DATASOURCE_PASSWORD:${DB_PASS:b8@qU0YM1HU>}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ACTUATOR ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.info.env.enabled=true

# LOGGING
logging.level.root=INFO
logging.level.Console=INFO
logging.level.com.sodimac=DEBUG
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=./app.log
logging.file.max-size=2MB
logging.file.max-history=5

fiscal.jwt.role.operador=operadores
fiscal.jwt.role.proveedor=proveedores
fiscal.jwt.header=Authorization

# SWAGGER
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs

# PAGINATION CONFIGURATION
fiscal-api.pagination.default-page-size=${PAGINATION_DEFAULT_SIZE:20}
fiscal-api.pagination.max-page-size=${PAGINATION_MAX_SIZE:100}

# UTILS API — UTILS_API_URL = k8s (con S), UTIL_API_URL = local dev (sin S)
utils.api.url=${UTILS_API_URL:${UTIL_API_URL:http://localhost:3712/api}}

# STATUS TRAIN API CONFIGURATION (STM-1166) — URL via utils.api.url
status-train.api.enabled=${STATUS_TRAIN_API_ENABLED:true}
status-train.api.timeout-ms=${STATUS_TRAIN_API_TIMEOUT:5000}
