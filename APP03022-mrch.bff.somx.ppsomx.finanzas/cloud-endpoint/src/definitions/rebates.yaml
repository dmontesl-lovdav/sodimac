RebateDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier
    rebateNumber:
      type: string
      description: Rebate number
    vendorNumber:
      type: integer
      description: Vendor identifier
    amount:
      type: string
      description: Rebate amount
    status:
      type: integer
      description: Rebate status
    effectiveDate:
      type: string
      format: date-time
      description: Effective date
    expirationDate:
      type: string
      format: date-time
      description: Expiration date
    published:
      type: boolean
      description: Published status
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateRebateDto:
  type: object
  required:
    - rebateNumber
    - vendorNumber
    - amount
  properties:
    rebateNumber:
      type: string
    vendorNumber:
      type: integer
    amount:
      type: string
    status:
      type: integer
    effectiveDate:
      type: string
      format: date-time
    expirationDate:
      type: string
      format: date-time
    published:
      type: boolean

UpdateRebateDto:
  type: object
  properties:
    status:
      type: integer
    amount:
      type: string
    effectiveDate:
      type: string
      format: date-time
    expirationDate:
      type: string
      format: date-time
    published:
      type: boolean

RebateCreditNoteDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Identificador interno del documento fiscal
    uuid:
      type: string
      format: uuid
      description: UUID fiscal de la nota de credito
    registeredAt:
      type: string
      format: date-time
      description: Fecha de registro de la nota de credito
    amount:
      type: string
      description: Importe total de la nota de credito expresado como decimal
      example: "114.81"
    series:
      type: string
      x-nullable: true
      description: Serie de la nota de credito
    folio:
      type: string
      x-nullable: true
      description: Folio de la nota de credito
  required:
    - id
    - uuid
    - registeredAt
    - amount

RebateFiscalDetailDto:
  type: object
  properties:
    rebateId:
      type: string
      format: uuid
      description: UUID interno del descuento comercial consultado
    vendorNumber:
      type: integer
      x-nullable: true
      description: Numero del proveedor
    invoiceFiscalUuid:
      type: string
      format: uuid
      x-nullable: true
      description: UUID fiscal de la factura original relacionada
    ncFiscalUuid:
      type: string
      format: uuid
      x-nullable: true
      description: UUID fiscal de la nota de credito relacionada
    creditNotes:
      type: array
      description: Notas de credito disponibles para mostrar en el detalle
      items:
        $ref: "#/RebateCreditNoteDto"
    message:
      type: string
      x-nullable: true
      description: Mensaje informativo sobre la disponibilidad de la relacion fiscal
  required:
    - rebateId
    - creditNotes

RebatePurchaseOrderDetailDto:
  type: object
  additionalProperties: false
  required:
    - purchaseOrder
    - receivedAmount
    - receptionDate
    - discountType
    - discountAmount
  properties:
    purchaseOrder:
      type: string
      minLength: 1
      maxLength: 100
      description: Numero de orden de compra
      example: "428726"
    receivedAmount:
      type: string
      pattern: '^-?\d{1,24}(\.\d{1,8})?$'
      description: Monto recibido como texto decimal sin separadores de miles
      example: "110651.0600"
    receptionDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Fecha civil de recepcion en formato YYYY-MM-DD
      example: "2026-04-13"
    discountType:
      type: integer
      description: Tipo de rebate; debe coincidir con source de la cabecera
      example: 1
    discountAmount:
      type: string
      pattern: '^-?\d{1,24}(\.\d{1,8})?$'
      description: Monto del descuento como texto decimal sin separadores de miles
      example: "4492.4334"

SyncRebatePurchaseOrderDetailsDto:
  type: object
  additionalProperties: false
  required:
    - documentNumber
    - vendorNumber
    - source
    - periodId
    - orders
  properties:
    documentNumber:
      type: string
      minLength: 1
      maxLength: 100
      description: Numero exacto del documento de la cabecera existente
      example: "01-CrossDock 01-000360189-26M"
    vendorNumber:
      type: integer
      description: Numero del proveedor
      example: 250053
    source:
      type: integer
      description: Tipo de rebate de la cabecera
      example: 1
    periodId:
      type: integer
      description: Identificador del periodo de la cabecera
      example: 189
    orders:
      type: array
      minItems: 1
      maxItems: 10000
      description: >
        Detalle completo que reemplaza la instantanea anterior.
        Cada discountType debe coincidir con source.
      items:
        $ref: "#/RebatePurchaseOrderDetailDto"

SyncRebatePurchaseOrderDetailsResultDto:
  type: object
  required:
    - rebateId
    - count
  properties:
    rebateId:
      type: string
      format: uuid
      description: UUID interno del descuento actualizado
    count:
      type: integer
      minimum: 1
      maximum: 10000
      description: Cantidad de filas de detalle guardadas
      example: 4

RebatePurchaseOrderDetailsDto:
  type: object
  required:
    - rebateId
    - orders
    - updatedAt
    - message
  properties:
    rebateId:
      type: string
      format: uuid
      description: UUID interno del descuento comercial
    orders:
      type: array
      description: Ultima instantanea de ordenes sincronizada
      items:
        $ref: "#/RebatePurchaseOrderDetailDto"
    updatedAt:
      type: string
      format: date-time
      x-nullable: true
      description: Fecha de sincronizacion; null si no existe detalle guardado
    message:
      type: string
      x-nullable: true
      description: Mensaje informativo; null cuando existe detalle guardado
