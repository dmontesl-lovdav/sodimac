apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - hpa-config.yaml
  - workload-identity.yaml

namespace: ${NAMESPACE_PROD}

configMapGenerator:
  - name: example-project-configmap
    envs:
      - env-configmap
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: example-project-secrets
    envs:
      - env-secrets
    options:
      disableNameSuffixHash: true

patches:
  - path: env-var.yaml
  - path: resources.yaml
  - path: sql-proxy.yaml
