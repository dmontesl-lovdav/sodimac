sonar.projectKey=APP03022-mrch.backend.somx.fiscal-api
sonar.projectName=APP03022-mrch.backend.somx.fiscal-api

sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.exclusions=**/target/**,**/*.xml,**/*.json,**/*.yaml,**/*.yml,**/generated/**,**/detecno/wsdl/**
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/model/**,**/generated/**,**/*Application.java

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Suprimir S1068 (campo privado sin uso) en DTOs: falso-positivo.
# Los DTOs usan Lombok @Data + los serializa Jackson por reflexion;
# Sonar no ve ese uso y marca los campos como muertos.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/model/dto/**