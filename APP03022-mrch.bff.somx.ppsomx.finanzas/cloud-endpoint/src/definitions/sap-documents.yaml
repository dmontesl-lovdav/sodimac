SapDocumentDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Same as sapDocumentUuid
    sapDocumentUuid:
      type: string
      format: uuid
    documentNumber:
      type: string
    referenceNumber:
      type: string
    vendorNumber:
      type: integer
    amount:
      type: number
    source:
      type: integer
    docSap:
      type: string
    message:
      type: string
    sapStatus:
      type: integer
    documentType:
      type: string
    fiscalUuids:
      type: array
      items:
        type: string
        format: uuid
    createdBy:
      type: integer
    createdAt:
      type: string
      format: date-time
    updatedBy:
      type: integer
    updatedAt:
      type: string
      format: date-time

CreateSapDocumentDto:
  type: object
  required:
    - documentNumber
    - referenceNumber
    - vendorNumber
    - amount
    - source
    - docSap
    - documentType
  properties:
    documentNumber:
      type: string
    referenceNumber:
      type: string
    vendorNumber:
      type: integer
    amount:
      type: string
    source:
      type: integer
    docSap:
      type: string
    message:
      type: string
    sapStatus:
      type: integer
    documentType:
      type: string
    createdBy:
      type: integer
    fiscalUuid:
      type: string
      format: uuid
      description: UUID fiscal SAT (alternativo a fiscalUuids)
    fiscalUuids:
      type: array
      items:
        type: string
        format: uuid
      description: Lista de UUIDs fiscales. Se requiere al menos uno (fiscalUuid o fiscalUuids)

UpdateSapDocumentDto:
  type: object
  properties:
    documentNumber:
      type: string
    referenceNumber:
      type: string
    vendorNumber:
      type: integer
    amount:
      type: string
    source:
      type: integer
    docSap:
      type: string
    message:
      type: string
    sapStatus:
      type: integer
    documentType:
      type: string
    updatedBy:
      type: integer
    fiscalUuid:
      type: string
      format: uuid
    fiscalUuids:
      type: array
      items:
        type: string
        format: uuid
