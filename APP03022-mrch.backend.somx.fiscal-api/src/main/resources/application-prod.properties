# ===============================
# CONFIGURACIÓN PARA PRODUCCIÓN
# ===============================

# Ubicación de XSL en classpath
pdf.xsl.dir=classpath:/xsl/
# Marca de agua (HU)
pdf.watermark.text=Documento informativo. No sustituye al XML oficial
# Logo por defecto si CatProveedor no devuelve
pdf.logo.default=classpath:/xsl/no_logo.jpg
# Directorio permitido para leer XML por ruta física
pdf.xml.allowedBaseDir=${PDF_XML_ALLOWED_BASE_DIR:/data/fisc/xml}
# Límite de tamaño de XML (10MB)
pdf.xml.maxBytes=10485760
# Subida de archivos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# xml.source=db     (desde base de datos)
# xml.source=remote (servicio de comprobante)
xml.source=${XML_SOURCE:db}

comprobante.base-url=${COMPROBANTE_BASE_URL:http://comprobante-api:8080}
comprobante.timeout-ms=${COMPROBANTE_TIMEOUT:5000}

catprov.enabled=${CATPROV_ENABLED:true}
catprov.base-url=${CATPROV_BASE_URL:http://catprov-api:8080}
catprov.timeout-ms=${CATPROV_TIMEOUT:5000}

# SECURITY CONFIGURATION (habilitada para prod)
security.enabled=true

pac.detecno.name=DETECNO
pac.carbajal.name=CARBAJAL

# DATABASE CONFIGURATION ──────────────────────────────────────────────
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://10.138.153.10:5432/userapp?currentSchema=tenant_fiscal}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=tenant_fiscal

# LOGGING LEVEL (más restrictivo en prod)
logging.level.root=WARN
logging.level.Console=WARN
logging.level.com.sodimac=INFO

# ACTUATOR (más restrictivo en prod)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# UTILS API CONFIGURATION
utils.api.url=${UTILS_API_URL:http://utils-api:8080}

