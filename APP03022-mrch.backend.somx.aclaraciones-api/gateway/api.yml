openapi: 3.1.0
info:
  title: Aclaraciones API
  description:
    Support RESTful operations for aclaraciones flow. The main object is
    Request (Aclaración).
  version: 1.0.0
servers:
  - url: http://localhost:8082
    description: Generated server url
security:
  - bearerAuth: []
paths:
  /related-information/{id}:
    get:
      tags:
        - related-information-controller
      summary: Get record (with image)
      operationId: getOne
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RelatedInformationDto"
      security:
        - bearerAuth: []
    put:
      tags:
        - related-information-controller
      summary: Update record
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelatedInformationDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RelatedInformationDto"
      security:
        - bearerAuth: []
    delete:
      tags:
        - related-information-controller
      summary: Delete record permanently
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            "*/*":
              schema:
                type: string
      security:
        - bearerAuth: []
  /notices/{noticeId}:
    get:
      tags:
        - notice-controller
      summary: Retrieves a Notice (Información Relacionada) based on its id.
      operationId: getNotice
      parameters:
        - name: Authorization
          in: header
          description: KeyCloack OAuth2 token.
          required: true
          example: Bearer XXXXXXXXX
        - name: noticeId
          in: path
          description: Notice (Información Relacionada) `id`.
          required: true
          schema:
            type: integer
            format: int32
          example: 112233
      responses:
        "200":
          description: Notice objects with given `id`.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/NoticeDto"
        "401":
          description: The request requires user authentication.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "500":
          description: Internal error.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
    put:
      tags:
        - notice-controller
      summary: Updates a Notice (Información Relacionada)
      operationId: putNotice
      parameters:
        - name: Authorization
          in: header
          description: KeyCloack OAuth2 token.
          required: true
          example: Bearer XXXXXXXXX
        - name: noticeId
          in: path
          description: Notice (Información Relacionada) `id`.
          required: true
          schema:
            type: integer
            format: int32
          example: 112233
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeDto"
        required: true
      responses:
        "200":
          description:
            Given notice (Información Relacionada) has been successfully
            updated.
          content:
            "*/*":
              schema:
                type: integer
                format: int32
        "401":
          description: The request requires user authentication.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "500":
          description: Internal error.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
    delete:
      tags:
        - notice-controller
      summary: Deletes a Notice (Información Relacionada)
      operationId: deleteNotice
      parameters:
        - name: Authorization
          in: header
          description: KeyCloack OAuth2 token.
          required: true
          example: Bearer XXXXXXXXX
        - name: noticeId
          in: path
          description: Notice (Información Relacionada) `id`.
          required: true
          schema:
            type: integer
            format: int32
          example: 112233
      responses:
        "200":
          description:
            Given notice (Información Relacionada) has been successfully
            deleted.
          content:
            "*/*":
              schema:
                type: integer
                format: int32
        "401":
          description: The request requires user authentication.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "403":
          description: Accessing the resource you were trying to reach is forbidden.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "404":
          description: The server has not found anything matching the requested URI.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "500":
          description: Internal error.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
