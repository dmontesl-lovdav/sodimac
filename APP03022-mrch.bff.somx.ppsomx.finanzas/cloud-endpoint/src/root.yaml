swagger: "2.0"
info:
  contact:
    email: jrcastillo@falabella.cl
    name: Arquitectura Falabella Tecnologia Corp.
  description: >
    Support RESTful operations for finanzas flow. This BFF provides access to
    financial operations including accounts payable, account statements, rebates,
    fiscal payments, shipping guides, carta porte, vendor management,
    three way match, and MIGO.
  title: Finanzas BFF API
  version: 2.0.0
  x-business-acronym: mrch
  x-capability-acronym: finanzas
  x-consumer-segments: retail
  x-service-name: finanzas

host: ${DOMAIN_OPENAPI}

schemes:
  - https

paths:
  /docs:
    get:
      summary: Swagger UI
      operationId: getSwaggerDocs
      produces:
        - text/html
      responses:
        "200":
          description: Swagger UI
      security: []

  /openapi.yaml:
    get:
      summary: OpenAPI spec
      operationId: getOpenApiYaml
      produces:
        - application/yaml
      responses:
        "200":
          description: OpenAPI spec
      security: []

  /swagger-ui.css:
    get:
      summary: Swagger UI CSS
      operationId: getSwaggerUiCss
      produces:
        - text/css
      responses:
        "200":
          description: Swagger UI CSS
      security: []

  /swagger-ui-bundle.js:
    get:
      summary: Swagger UI JS bundle
      operationId: getSwaggerUiBundle
      produces:
        - application/javascript
      responses:
        "200":
          description: Swagger UI JS
      security: []

  /swagger-ui-standalone-preset.js:
    get:
      summary: Swagger UI JS preset
      operationId: getSwaggerUiPreset
      produces:
        - application/javascript
      responses:
        "200":
          description: Swagger UI preset
      security: []

  /ppsomx/backend-finanzas/docs:
    get:
      summary: Swagger UI aliased path
      operationId: getSwaggerDocsAliased
      produces:
        - text/html
      responses:
        "200":
          description: Swagger UI
      security: []

  /ppsomx/backend-finanzas/openapi.yaml:
