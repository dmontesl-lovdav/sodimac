apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROJECT_NAME}
spec:
  selector:
    matchLabels:
      app: ${PROJECT_NAME}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app: ${PROJECT_NAME}
    spec:
      serviceAccountName:
      containers:
      - image: foo/bar
        name: ${PROJECT_NAME}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        env:
        - name: CI_JOB_ID
          value: "${CI_JOB_ID}"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 2
          initialDelaySeconds: 40
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
