<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
	
<head>

<title id="pageTitle">CFDI</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
<meta http-equiv="x-ua-compatible" content="ie=edge">

<link rel="shortcut icon" th:href="@{/img/favicon.ico}" mce_href="favicon.ico"
	type="image/x-icon">

<!-- CSS styles -->

<style>
    .btn-secondary {
      color: #212529;
      background-color: #e9ecef;
      border-color: #adb5bd;
    }

    .btn-secondary:hover {
      color: #212529;
      background-color: #d3d9df;
      border-color: #adb5bd;
    }

    .btn-secondary:focus, .btn-secondary.focus {
      color: #212529;
      background-color: #d3d9df;
      border-color: #adb5bd;
      box-shadow: 0 0 0 0.2rem rgba(173, 181, 189, 0.5);
    }
    
    .hover-text {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0; /* Hide the text by default */
      transition: opacity 0.3s ease-in-out; /* Add smooth transition effect */
    }
  </style>

<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
<link th:href="@{/css/bootstrap-reboot.min.css}" rel="stylesheet">
<link th:href="@{/css/sweetalert2.min.css}" rel="stylesheet">
<link th:href="@{/js/datepicker/bootstrap-datepicker.standalone.min.css}" rel="stylesheet">
<link th:href="@{/css/fontawesome/css/all.css}" rel="stylesheet">
<link th:href="@{/css/app.css}" rel="stylesheet">
<link th:href="@{/css/custom.css}" rel="stylesheet">
<link th:href="@{/css/dataTables.checkboxes.css}" rel="stylesheet">
<link th:href="@{/css/mdb-pro.css}" rel="stylesheet">
<link th:href="@{/css/spinner.css}" rel="stylesheet">

<script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/js/popper.min.js}"></script>
<script type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/js/mdb.min.js}"></script>
<script type="text/javascript" th:src="@{/js/addons/datatables.min.js}"></script>
<script type="text/javascript" th:src="@{/js/addons/dataTables.fixedColumns.min.js}"></script>
<script type="text/javascript" th:src="@{/js/addons/dataTables.checkboxes.min.js}"></script>
<script type="text/javascript" th:src="@{/js/sweetalert2.min.js}"></script>
<script type="text/javascript" charset="UTF-8" th:src="@{/js/jquery.mask.min.js}"></script>
<script type="text/javascript" th:src="@{/js/datepicker/bootstrap-datepicker.min.js}"></script>
<script type="text/javascript" th:src="@{/js/datepicker/bootstrap-datepicker.es.min.js}"></script>

</head>


<body>
	
	<header th:insert="fragments/header :: header-principal" id="header">
	</header>

	<div class="modal" tabindex="-1" id="modalConfirmar">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	      	<h4 class="modal-title" th:text="#{INCIDENTES.TITULO}"></h4>
	        <button type="button" class="close" data-dismiss="modal">&times;</button>
	      </div>
	      <div class="modal-body">
	        <div id="divWarningConfirmar" class="alert alert-warning"></div>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-danger" data-dismiss="modal">
                   <i class="fa fa-times"></i> <span th:text="#{COMUN.CANCELAR}"></span>
               </button>
               <button type="button" class="btn btn-primary" onclick="deleteTicketConfirmOnClick()">
                   <i class="fa fa-floppy-o"></i> <span th:text="#{COMUN.ACEPTAR}"></span>
               </button>
	      </div>
	    </div>
	  </div>
	</div>
	
	<div class="modal" tabindex="-1" id="modalConfirmarIntentos">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	      	<h4 class="modal-title" th:text="#{INCIDENTES.TITULO}"></h4>
	        <button type="button" class="close" data-dismiss="modal">&times;</button>
	      </div>
	      <div class="modal-body">
	        <div id="divWarningConfirmarIntentos" class="alert alert-warning"></div>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-danger" data-dismiss="modal">
                   <i class="fa fa-times"></i> <span th:text="#{COMUN.CANCELAR}"></span>
               </button>
               <button type="button" class="btn btn-primary" onclick="deleteIntentosConfirmOnClick()">
                   <i class="fa fa-floppy-o"></i> <span th:text="#{COMUN.ACEPTAR}"></span>
               </button>
	      </div>
	    </div>
	  </div>
	</div>

	<div class="modal pullDown" id="responsive2" tabindex="-1" role="dialog" aria-hidden="true">
	    <div class="modal-dialog modal-lg" role="document">
	        <div class="modal-content">
	            <div class="modal-header">
	                <h5 class="modal-title" id="responsivemodal">Reenvío de correo</h5>
	                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	                    <i class="ti-close"></i>
	                </button>
	            </div>
	            <div class="modal-body">
	                <div class="row">
	                    <div class="col-12">
	                        <form id="reenvioMail">
	                            <div class="form-group">
	                            	<input type="hidden" id="uuid" class="uuid" value=""/>
	                                <input type="text" class="form-control" id="correo_electronico_anterior" name="correo_electronico_anterior" readonly autocomplete="off">
	                                <label for="correo_electronico_anterior" class="">
	                                    <span class="text-danger">*</span>Correo electrónico:
	                                </label>
	                                <div>
	                                    <div id="correo_electronico_anterior_validation"></div>
	                                </div>
	                            </div>
	                            <div class="form-group">
	                                <input type="text" class="form-control " id="correo_electronico_nuevo" name="correo_electronico_nuevo" onblur="validaCamposVacios('correo_electronico_nuevo', '#correo_electronico_nuevo_validation', 'full has-success', 'full has-danger','email')" maxlength="50" autocomplete="off">
	                                <label for="correo_electronico_nuevo" class="">
	                                    <span class="text-danger">*</span>Con copia para:
	                                </label>
	                                <div>
	                                    <div id="correo_electronico_nuevo_validation"></div>
	                                </div>
	                            </div>
	                            <div class="">
	                                <div class="col text-right px-0">
	                                    <button type="button" id="enviarUserDate" onClick="reenviarFactura()" class="btn btn-primary">Enviar</button>
	                                </div>
	                            </div>
	
	                        </form>
	                    </div>
	                </div>
	            </div>
	            <!-- /.modal-body-->
	        </div>
	        <!-- /.modal-content-->
	    </div>
	    <!-- /.modal-dialog-->
	</div>

	<section class="mt-5 animated fadeIn">
		<div class="mask rgba-gradient">
			<div class="container h-100 mt-5 mb-5">

	                                 <div class="text-center">
	                                 	<div id="spinner" class="hide loading"></div>
	                                 </div>

				<div class="row pt-5 mt-5">

					<div th:include="fragments/incidentesTimbradoList :: fragmentStart" id="fragmentDiv" class="col-md-10">
					</div>

		            <div class="col-md-2">
		                <div class="card">
		                    <div class="card-body">
		                        <div class="row">
		                            <div class="col-12 col-sm-12 col-md-12 m-b-25">
		                                <div class="form-group m-b-0">
		                                    <input id="ticketBusqueda" value="" type="text" class="form-control" maxlength="19" onkeypress="ticketInput_onkeypress();" autocomplete="off" >
	
		                                    <label for="ticketBusqueda" class="control-label">
		                                        Ticket / OC:
		                                    </label>
		                                    <div>
		                                        <div class="col-12" id="montoInput_validation">
		                                        </div>
		                                    </div>
		                                    <div class="txt-assist">
		                                        Ingrese el ticket/OC que desea revisar.
		                                    </div>
		                                </div><!-- /.form-group -->
		                            </div>
		                        </div>
		                        <div th:if="${session.privsUsuario.r eq 1}" class="row text-center">
		                        	 <div class="col-12 col-sm-12 col-md-12">
		                                <button id="btnConsultarTicket" type="button" class="btn btn-primary btn-block" onclick="consultarTicket()" tabindex="1">
		                                    Consultar
		                                </button>
		                            </div>
			                        <div id="messages_consultas_multiples" style="margin-left: 20px;">
			                        </div>
		                        </div>
		                        	                        
		                        <div class="row text-center" style="padding-top: 5%;">
		                        	 <div class="col-12 col-sm-12 col-md-12">
		                        	 	<!-- Aqui se indica el rol de Gaby (Soporte) -->
		                                <button th:if="${idRol eq 1 or idRol eq 3}" id="btnEliminarIntentos" type="button" class="btn btn-primary btn-block" style="padding-left: 0 !important; padding-right: 0 !important;" onclick="showDeleteIntentosModalForm()" tabindex="1" disabled>
		                                    Eliminar intentos de timbrado
		                                </button>
		                            </div>
			                        <div id="messages_consultas_multiples" style="margin-left: 20px;">
			                        </div>
		                        </div>
	
		                    </div><!-- /.card-body -->
		                </div><!-- /.card -->
		            </div><!-- /.col-12 -->
				</div>
			</div>
		</div>

	</section>
	
	<footer th:insert="fragments/footer :: footer-principal" class="page-footer font-small grey lighten-5 fixed-bottom">

	</footer>

<script type="text/javascript" charset="UTF-8" th:src="@{/js/admin/incidentesTimbradoPage.js}"></script>
<script>
		
		$(document).ready(function() {
		
			// Clean notify message
			toastr.clear();
			// Styles for navigation bar.
			$(".nav-item").removeClass("active");
			$(".dropdown-item").removeClass("active");
			$("#navParamAdmin").addClass("active");
			
		});
		
	</script>

</body>

</html>
