          in: query
          required: false
          description: Module identifier
          type: integer
          format: int32
        - name: idType
          in: query
          required: false
          description: Parameter type identifier
          type: integer
          format: int32
        - name: name
          in: query
          required: false
          description: Parameter name
          type: string
        - name: status
          in: query
          required: false
          description: Status code
          type: integer
          format: int32
        - name: includeHistory
          in: query
          required: false
          description: Include all versions history
          type: boolean
        - name: page
          in: query
          required: false
          description: Page number
          type: integer
          format: int32
        - name: limit
          in: query
          required: false
          description: Page size
          type: integer
          format: int32
        - name: sort
          in: query
          required: false
          description: Sort field
          type: string
          enum:
            - idParameter
            - name
            - createdAt
            - updatedAt
        - name: order
          in: query
          required: false
          description: Sort order
          type: string
          enum:
            - asc
            - desc
      responses:
        '200':
          description: List of parameters
          schema:
            $ref: '#/definitions/ParameterListResponse'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ExceptionWrapper'
      security:
        - bearerAuth: []
    post:
      tags:
        - parameters
      summary: Create parameter
      operationId: createParameter
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateParameterDto'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/ParameterSingleResponse'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '409':
