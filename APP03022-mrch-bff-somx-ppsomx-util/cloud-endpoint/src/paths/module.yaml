modules:
  get:
    tags:
      - modules
    summary: List modules
    operationId: listModules
    produces:
      - application/json
    parameters:
      - name: name
        in: query
        required: false
        description: Partial module name
        type: string
    responses:
      "200":
        description: List of modules
        schema:
          $ref: "../definitions/module.yaml#/ModuleListResponse"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  post:
    tags:
      - modules
    summary: Create module
    operationId: createModule
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/module.yaml#/CreateModuleDto"
    responses:
      "201":
        description: Created
        schema:
          $ref: "../definitions/module.yaml#/ModuleSingleResponse"
      "400":
        description: Bad request
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

modules-by-id:
  get:
    tags:
      - modules
    summary: Get module by ID
    operationId: getModuleById
    produces:
      - application/json
    parameters:
      - name: id
        in: path
        required: true
        description: Module identifier
        type: integer
        format: int32
    responses:
      "200":
        description: Found
        schema:
          $ref: "../definitions/module.yaml#/ModuleSingleResponse"
      "404":
        description: Module not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  patch:
    tags:
      - modules
    summary: Update module
    operationId: updateModule
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - name: id
        in: path
        required: true
        description: Module identifier
        type: integer
        format: int32
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/module.yaml#/UpdateModuleDto"
    responses:
      "200":
        description: Updated
        schema:
          $ref: "../definitions/module.yaml#/ModuleSingleResponse"
      "404":
        description: Module not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

  delete:
    tags:
      - modules
    summary: Delete module
    operationId: deleteModule
    produces:
      - application/json
    parameters:
      - name: id
        in: path
        required: true
        description: Module identifier
        type: integer
        format: int32
    responses:
      "200":
        description: Deleted
        schema:
          $ref: "../definitions/module.yaml#/ModuleDeleteResponse"
      "404":
        description: Module not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []
