swagger: "2.0"
info:
  contact:
    email: jrcastillo@falabella.cl
    name: Arquitectura Falabella Tecnologia Corp.
  description:
    "Support RESTful operations for finanzas flow. The main object is
    Financial Transaction (Previous version).
    "
  title: Finanzas API (Old)
  version: 0.9.0
  x-business-acronym: mrch
  x-capability-acronym: odbms
  x-consumer-segments: retail
  x-service-name: odbms-finanzas
host: ${DOMAIN_OPENAPI}
schemes:
  - https
paths:
  /transactions:
    get:
      summary: Retrieves financial transactions (deprecated).
      operationId: getTransactionsOld
      tags: [transaction-controller]
      produces:
        - application/json
      parameters:
        - in: header
          name: Authorization
          required: true
          type: string
          description: Keycloak OAuth2 token.
          x-example: Bearer XXXXXXXXX
      responses:
        "200":
          description: Matching transaction array.
          schema:
            type: array
            items:
              $ref: "#/definitions/TransactionDto"
        "401":
          description: Unauthorized.
          schema: { $ref: "#/definitions/ExceptionWrapper" }
        "500":
          description: Internal error.
          schema: { $ref: "#/definitions/ExceptionWrapper" }
      security:
        - bearerAuth: []
definitions:
  ExceptionWrapper:
    properties:
      code:
        description: Numeric HTTP Status error
        example: 401
        format: int32
        type: integer
      message:
        description: Error description
        example: Unauthorized
        type: string
    type: object
  TransactionDto:
    type: object
    properties:
      id:
        type: string
        description: Unique transaction identifier
        example: "TRX-2025-001"
      amount:
        type: number
        format: float
        description: Transaction amount
        example: 1500.50
      currency:
        type: string
        description: Currency code
        example: "MXN"
      description:
        type: string
        description: Transaction description
        example: "Payment to provider XYZ"
securityDefinitions:
  bearerAuth:
    in: header
    name: Authorization
    type: apiKey
security:
  - bearerAuth: []
x-google-endpoints:
  - allowCors: true
    name: ${DOMAIN_OPENAPI}



