ShippingGuideDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier
    guideNumber:
      type: string
      description: Shipping guide number
    vendorNumber:
      type: integer
      description: Vendor identifier
    shipmentDate:
      type: string
      format: date-time
      description: Shipment date
    deliveryDate:
      type: string
      format: date-time
      description: Expected delivery date
    origin:
      type: string
      description: Origin location
    destination:
      type: string
      description: Destination location
    status:
      type: integer
      description: Shipping status
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateShippingGuideDto:
  type: object
  required:
    - guideNumber
    - vendorNumber
    - shipmentDate
  properties:
    guideNumber:
      type: string
    vendorNumber:
      type: integer
    shipmentDate:
      type: string
      format: date-time
    deliveryDate:
      type: string
      format: date-time
    origin:
      type: string
    destination:
      type: string
    status:
      type: integer

UpdateShippingGuideDto:
  type: object
  properties:
    status:
      type: integer
    deliveryDate:
      type: string
      format: date-time
    destination:
      type: string

CancelShippingGuidesDto:
  type: object
  required:
    - shippingGuideIds
    - reasonId
  properties:
    shippingGuideIds:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
      description: UUIDs de las guías a cancelar (estatus 9 / ECF009)
    reasonId:
      type: integer
      description: Motivo de cancelación
    comment:
      type: string
      maxLength: 254
      description: Comentario opcional de cancelación

CancelShippingGuidesResponse:
  type: object
  properties:
    updatedCount:
      type: integer
      description: Cantidad de guías actualizadas

UpdateShippingGuideStatusDto:
  type: object
  required:
    - shippingGuideId
    - targetStatus
    - reasonId
    - comment
  properties:
    shippingGuideId:
      type: string
      format: uuid
      description: UUID de la guía de embarque
    targetStatus:
      type: integer
      description: Estatus destino (1, 3 o 4)
    reasonId:
      type: integer
      description: Motivo del cambio de estatus
    series:
      type: string
      maxLength: 100
      description: Serie de factura (obligatorio si targetStatus = 3)
    folio:
      type: string
      maxLength: 100
      description: Folio de factura (obligatorio si targetStatus = 3)
    uuid:
      type: string
      maxLength: 36
      description: UUID de factura (obligatorio si targetStatus = 3)
    comment:
      type: string
      maxLength: 254
      description: Comentario del cambio
