  /requests:
    get:
      tags:
        - request-controller
      summary:
        Retrieves a list of Request (Aclaración) based for the current user
        session.
      operationId: getRequests
      parameters:
        - name: Authorization
          in: header
          description: KeyCloack OAuth2 token.
          required: true
          example: Bearer XXXXXXXXX
        - name: criteria
          in: query
          description: "Optional search criteria (orderId, provider or requestId)."
          required: false
          schema:
            type: string
          example: 112233
        - name: dateFrom
          in: query
          description: "Optional lower creation date, inclusive."
          required: false
          schema:
            type: string
          example: 2025-01-01
        - name: dateTo
          in: query
          description: "Optional upper creation date, inclusive."
          required: false
          schema:
            type: string
          example: 2025-01-31
        - name: reason
          in: query
          description: Optional reason `id`.
          required: false
          schema:
            type: integer
            format: int32
          example: 1
        - name: status
          in: query
          description: Optional status `id`.
          required: false
          schema:
            type: integer
            format: int32
          example: 10
      responses:
        "200":
          description: Request objects that meets given criteria.
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestDto"
        "401":
          description: The request requires user authentication.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExceptionWrapper"
        "403":
