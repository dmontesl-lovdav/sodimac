rebates-search:
  get:
    tags: [rebates]
    summary: Search rebates
    operationId: searchRebates
    produces: [application/json]
    parameters:
      - name: q
        in: query
        required: false
        description: Search query
        type: string
      - name: vendorNumber
        in: query
        required: false
        description: Vendor number
        type: integer
      - name: status
        in: query
        required: false
        description: Rebate status
        type: integer
    responses:
      "200":
        description: Search results
        schema:
          type: array
          items:
            $ref: "../definitions/rebates.yaml#/RebateDto"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

rebates-export-csv:
  get:
    tags: [rebates]
    summary: Export filtered rebates to CSV
    operationId: exportFilteredRebatesToCsv
    produces: [text/csv]
    parameters:
      - name: status
        in: query
        required: false
        description: Filter by status
        type: integer
      - name: vendorNumber
        in: query
        required: false
        description: Filter by vendor
        type: integer
    responses:
      "200":
        description: CSV file with filtered rebates
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
