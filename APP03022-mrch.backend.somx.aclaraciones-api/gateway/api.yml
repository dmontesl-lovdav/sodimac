    RequestDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Numeric Unique Identifier
          example: 99888
        creationTime:
          type: string
          format: date-time
          description: Creation time in ISO 8601 format
          example: 2025-05-14T15:51:31Z
        elapsedTime:
          type: integer
          format: int32
          description: Elapsed time since `creationTime` in days
          example: 5
        status:
          type: integer
          format: int32
          description: |
            Status of this Request (Aclaración). Available values are:
            - STATUS_UNATTENDED = 10;
            - STATUS_ONGOING = 20;
            - STATUS_RESOLVED = 30;
            - STATUS_CANCELLED = 40;
          example: 40
        orderId:
          type: string
          description: Related Order Id
          example: 999-888-777
        reason:
          type: integer
          format: int32
          description:
            Reason for this Request. See `catalogs` methods for further
            info.
          example: 5
        detail:
          type: integer
          format: int32
          description:
            Details of an specific reason for this Request. See `catalogs`
            methods for further info.
          example: 6
        description:
          type: string
          description: String description.
          example: Random string
        requester:
          type: string
          description: Name or email of requester.
          example: Gabriel Galván
        operator:
          type: string
          description: Name or email of current supporter.
          example: Gabriel Galván
        company:
          type: string
          description: Requester company name.
          example: Empresa S.A.
        rut:
          type: string
          description: Requester tax identifier.
          example: XAXA010101SV5
        businessUnit:
          type: integer
          format: int32
          description:
            Business Unit for this Request. See `catalogs` methods for
            further info.
          example: 6
        country:
          type: integer
          format: int32
          description:
            Country of origin for this Request. See `catalogs` methods
            for further info.
          example: 6
        module:
          type: integer
          format: int32
          description:
            System's module for this Request. See `catalogs` methods for
            further info.
          example: 6
        clazz:
          type: integer
          format: int32
          description:
            Task Kanban board column. See `catalogs` methods for further
            info.
          example: 6
        progress:
          type: integer
          format: int32
          description: Task progress. See `catalogs` methods for further info.
          example: 6
        priority:
          type: integer
          format: int32
          description: Task priority. See `catalogs` methods for further info.
          example: 6
        repeatitiveness:
          type: integer
          format: int32
          description: Task repeatitiveness. See `catalogs` methods for further info.
          example: 6
