    tags:
      - carta-porte
    summary: Actualizar estado de guías tras cambios Carta Porte
    operationId: cartaPorteUpdateAllStatusGuia
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: "../definitions/carta-porte.yaml#/ShippginGuideSummaryListDto"
    responses:
