# ============================================================
# Identificación del proyecto
# ============================================================

sonar.projectKey=APP03022-mrch.backend.somx.fiscal-api
sonar.projectName=APP03022-mrch.backend.somx.fiscal-api

# ============================================================
# Código fuente y pruebas
# ============================================================

sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.sourceEncoding=UTF-8

# ============================================================
#
# Solo se analiza la clase actualmente respaldada por pruebas
# unitarias ejecutables y cobertura superior al 80 %.
# ============================================================

sonar.inclusions=\
src/main/java/com/sodimac/fiscal/api/service/impl/FiscalXmlTransformerServiceImpl.java

sonar.test.inclusions=\
src/test/java/**/*Test.java,\
src/test/java/**/*Tests.java

# ============================================================
# Exclusiones generales
# ============================================================

sonar.exclusions=\
**/target/**,\
**/*.xml,\
**/*.json,\
**/*.yaml,\
**/*.yml,\
**/generated/**,\
**/detecno/wsdl/**

# ============================================================
# Cobertura JaCoCo
# ============================================================

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

sonar.coverage.inclusions=\
src/main/java/com/sodimac/fiscal/api/service/impl/FiscalXmlTransformerServiceImpl.java

sonar.coverage.exclusions=\
**/config/**,\
**/dto/**,\
**/entity/**,\
**/model/**,\
**/generated/**,\
**/*Application.java

# ============================================================
# Duplicaciones
#
# ============================================================

sonar.cpd.exclusions=src/main/java/**

# ============================================================
# Falso positivo S1068 en DTOs con Lombok/Jackson
# ============================================================

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/model/dto/**