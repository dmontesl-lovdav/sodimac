          type: integer
          format: int32
        - name: name
          in: query
          required: false
          description: Parameter name
          type: string
        - name: status
          in: query
          required: false
          description: Status code
          type: integer
          format: int32
        - name: includeHistory
          in: query
          required: false
          description: Include all versions history
          type: boolean
        - name: page
          in: query
          required: false
          description: Page number
          type: integer
          format: int32
        - name: limit
          in: query
          required: false
          description: Page size
          type: integer
          format: int32
        - name: sort
          in: query
          required: false
          description: Sort field
          type: string
          enum:
            - idParameter
            - name
            - createdAt
            - updatedAt
        - name: order
          in: query
          required: false
          description: Sort order
          type: string
          enum:
            - asc
            - desc
