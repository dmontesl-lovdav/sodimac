securityDefinitions:
  api_key:
    in: query
    name: key
    type: apiKey
  bearerAuth:
    in: header
    name: Authorization
    type: apiKey
  keycloak:
    authorizationUrl: ""
    flow: implicit
    scopes: {}
    type: oauth2
    x-google-audiences: vendor-backend
    x-google-issuer: ${KEYCLOAK}/auth/realms/corp
    x-google-jwks_uri: ${JWKS_URL}
    x-google-jwt-locations:
      - header: Authorization
        value_prefix: "Bearer "

security:
  - bearerAuth: []

x-components: {}

x-google-endpoints:
  - allowCors: true
    name: ${DOMAIN_OPENAPI}

