      parameters:
        - description: Sla `id`.
          format: int32
          in: path
          name: id
          required: true
          type: integer
          x-example: 112233
        - default: true
          description: Publishing status
          in: query
          name: publish
          required: false
          type: boolean
          x-example: true
      responses:
        '401':
          description: The request requires user authentication.
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '403':
          description: Accessing the resource you were trying to reach is forbidden.
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '404':
          description: The server has not found anything matching the requested URI.
          schema:
            $ref: '#/definitions/ExceptionWrapper'
        '500':
          description: Internal error.
          schema:
            $ref: '#/definitions/ExceptionWrapper'
      tags:
        - sla-controller
      operationId: publishSla
      summary: De/publish a Sla.
