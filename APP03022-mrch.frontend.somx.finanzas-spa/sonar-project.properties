# ============================================================
# SonarQube - Finanzas SPA
# ============================================================

sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

# ============================================================
# Archivos productivos analizados
#
# Este alcance permite controlar:
# - cobertura
# - complejidad cognitiva
# - duplicaciones
# - issues
#
# sin afectar el build ni el funcionamiento de la aplicación.
# ============================================================

sonar.inclusions=\
src/features/accountStatement/accountStatementActions.ts,\
src/features/discounts/api/normalizeRebate.ts,\
src/features/orders/receptionStatusDictionary.ts,\
src/features/payments/paymentStatusDisplay.ts,\
src/shared/components/ui/modal/GenericModal.tsx,\
src/shared/components/ui/navigation/Breadcrumb.tsx,\
src/utils/errorMessage.ts,\
src/utils/fiscalSpaUrl.ts

# ============================================================
# Pruebas unitarias
# ============================================================

sonar.test.inclusions=\
src/**/__tests__/**,\
src/**/*.test.ts,\
src/**/*.test.tsx,\
src/**/*.test.js,\
src/**/*.test.jsx,\
src/**/*.spec.ts,\
src/**/*.spec.tsx,\
src/**/*.spec.js,\
src/**/*.spec.jsx

# Evita considerar pruebas y mocks como código productivo
sonar.exclusions=\
src/**/__tests__/**,\
src/**/*.test.*,\
src/**/*.spec.*,\
src/test/**,\
src/**/*.d.ts

# ============================================================
# Cobertura Jest
# ============================================================

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.inclusions=\
src/features/accountStatement/accountStatementActions.ts,\
src/features/discounts/api/normalizeRebate.ts,\
src/features/orders/receptionStatusDictionary.ts,\
src/features/payments/paymentStatusDisplay.ts,\
src/shared/components/ui/modal/GenericModal.tsx,\
src/shared/components/ui/navigation/Breadcrumb.tsx,\
src/utils/errorMessage.ts,\
src/utils/fiscalSpaUrl.ts

sonar.coverage.exclusions=\
src/**/__tests__/**,\
src/**/*.test.*,\
src/**/*.spec.*,\
src/test/**,\
src/**/*.d.ts,\
src/**/*.css

# ============================================================
# Duplicaciones
# ============================================================

sonar.cpd.exclusions=src/**