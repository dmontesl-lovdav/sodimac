# ============================================================================
# CATALOGOS API - Configuration
# ============================================================================

spring.application.name=catalogos-api
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/

# PERFIL POR DEFECTO (dev = sin seguridad)
spring.profiles.active=${ENV_DEV:dev}

# ============================================================================
# Database Configuration - PostgreSQL (shared with fiscal-api)
# Host: localhost, Port: 5434, Database: b2b_portal, Schema: shared_catalogs
# ============================================================================
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/b2b_portal?sslmode=disable}
spring.datasource.username=${DATASOURCE_USERNAME:wwwb2bportal}
spring.datasource.password=${DATASOURCE_PASSWORD:b8@qU0YM1HU>}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=shared_catalogs

# ============================================================================
# OpenAPI / Swagger
# ============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# ============================================================================
# Actuator
# ============================================================================
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

# ============================================================================
# Logging
# ============================================================================
logging.level.root=INFO
logging.level.com.sodimac.catman=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.file.name=./app.log
logging.file.max-size=2MB
logging.file.max-history=5
