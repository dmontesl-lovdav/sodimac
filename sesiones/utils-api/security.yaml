security-user-utility:
  post:
    tags:
      - security
    summary: Register or touch catalog user from JWT (utility entry)
    description: >
      Uses Authorization Bearer JWT; upserts core_security.user_data by claim `sub`
      or updates `updated_at` if the row exists. Intended once per client session
      when opening the utility home screen.
    operationId: postUserUtilitySession
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: body
        name: body
        required: false
        schema:
          type: object
          description: Optional empty JSON object; claims are taken from the Bearer token.
    responses:
      "200":
        description: User registered or catalog row updated
        schema:
          $ref: "../definitions/security.yaml#/GenericSuccessResponse"
      "400":
        description: Bad request (e.g. token without sub)
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized or invalid JWT
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []

