CreateFinanzasPaymentDetailItemDto:
  type: object
  required:
    - documentNumber
    - documentReference
    - amount
    - documentType
    - sapDocument
    - paymentLineType
  properties:
    documentNumber:
      type: string
      example: "DOC-1001"
    documentReference:
      type: string
      example: "REF-1001"
    amount:
      type: string
      pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
      example: "1000.00"
    documentType:
      type: string
      example: "FA"
    sapDocument:
      type: string
      example: "5100001234"
    paymentLineType:
      type: string
      enum:
        - INCOME
        - CREDIT_NOTE
      example: "INCOME"

CreateFinanzasPaymentHeaderWithDetailsDto:
  type: object
  required:
    - company
    - anio
    - vendorNumber
    - totalAmount
    - paymentDate
    - details
  properties:
    company:
      type: integer
      example: 1
    anio:
      type: integer
      example: 2026
    vendorNumber:
      type: integer
      example: 20045
    currency:
      type: string
      default: "MXN"
      example: "MXN"
    totalAmount:
      type: string
      pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
      example: "2500.00"
    paymentDate:
      type: string
      format: date
      example: "2026-03-09"
    status:
      type: integer
      default: 1
      example: 1
    createdBy:
      type: integer
      example: 123
    details:
      type: array
      minItems: 1
      items:
        $ref: "#/CreateFinanzasPaymentDetailItemDto"

ResponsePageableFinanzasPaymentDto:
  type: object
  properties:
    content:
      type: array
      items:
        $ref: "#/FinanzasPaymentDto"
    totalElements:
      type: integer
      example: 25
    numberOfElements:
      type: integer
      example: 10
    totalPages:
      type: integer
      example: 3
    pageNumber:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 10

FinanzasPaymentHeaderWithDetailsCreateData:
  type: object
  properties:
