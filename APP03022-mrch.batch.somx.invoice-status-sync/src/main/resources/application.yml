spring:
  application:
    name: invoice-status-sync

  datasource:
    jdbc-url: jdbc:h2:mem:invoicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

server:
  port: 8080

# Multiple DataSources - Conexiones Reales
datasource:
  sodimac-sap:
    jdbc-url: jdbc:sqlserver://10.138.153.10:1433;databaseName=SODIMAC_SAP_DEV;encrypt=false;trustServerCertificate=true;loginTimeout=10
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${SODIMAC_SAP_USER:SodimacETLUSR}
    password: ${SODIMAC_SAP_PASSWORD}
    initialization-fail-timeout: -1
    connection-timeout: 10000
  sapito:
    jdbc-url: jdbc:oracle:thin:@10.140.0.182:1541:odsrmxts
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${SAPITO_USER:UODSRMX}
    password: ${SAPITO_PASSWORD}
    initialization-fail-timeout: -1
    connection-timeout: 10000
  i213:
    jdbc-url: jdbc:sqlserver://10.138.153.10:1433;databaseName=AdmIF213ProdDB;encrypt=false;trustServerCertificate=true;loginTimeout=10
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${I213_USER:SodimacETLUSR}
    password: ${I213_PASSWORD:$DEV50dimac2026}
    initialization-fail-timeout: -1
    connection-timeout: 10000

# Batch Scheduler (HU STM-1309)
batch:
  scheduler:
    enabled: true
    cron: "0 30 7 * * *"
    max-retries: 2
    retry-interval-minutes: 30
    max-execution-minutes: 15
  # Batch Control Database (SODIMAC_BATCH_DEV)
  datasource:
    url: jdbc:sqlserver://10.138.153.10:1433;databaseName=SODIMAC_BATCH_DEV;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
    username: ${SODIMAC_BATCH_USER:SodimacETLUSR}
    password: ${SODIMAC_BATCH_PASSWORD:$DEV50dimac2026}

# FBC Portal (Fiscal BFF)
fbc:
  portal:
    # URL Base del BFF Fiscal
    url: ${FBC_PORTAL_URL:https://dev.fbusinesscenter.com/ppsomx/fiscal}

    # Endpoints
    endpoints:
      search: /invoices/search
      update-status: /invoices/{uuid}/status  # NOTA: NO disponible en BFF, usar fiscal-api
      payments: /payments

    # Configuración de búsqueda
    search:
      max-date-range-months: 6
      default-page-size: 100
      default-tipo-documento: I

    # Modo mock para desarrollo (deshabilitar cuando se use el BFF real)
    mock-enabled: ${FBC_MOCK_ENABLED:true}

    # Timeout para llamadas al BFF
    timeout: ${FBC_TIMEOUT:30000}

    # Mapeo de estatus HU → BFF (solo estatus finales)
    status-mapping:
      # Solo sincronizar estatus relevantes para el portal
      9: 3    # PENDING_SAP_ACCOUNTING → Pendiente de Contabilizar
      10: 7   # PENDING_PAYMENT → Pendiente de Pago
      11: 8   # PAID → Pagado
      13: 11  # ACCOUNTING_REJECTED → Rechazo Contable
      # Estados 6,7,8,16 NO se sincronizan (son internos de SAPITO/i213)

# Alerts
alert:
  notification:
    email:
      enabled: false
      recipients: ${ALERT_RECIPIENTS:soporte@empresa.com}

# Resilience4j
resilience4j:
  retry:
    instances:
      fbcPortal:
        max-attempts: 3
        wait-duration: 2s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,scheduledtasks
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.invoicesync: DEBUG
