account-statement-by-uuid:
  get:
    tags:
      - account-statement
    summary: Get account statement by UUID
    operationId: getAccountStatementByUuid
    produces:
      - application/json
    parameters:
      - name: uuid
        in: path
        required: true
        type: string
        format: uuid
    responses:
      "200":
        description: Found
        schema:
          $ref: "../definitions/account-statement.yaml#/AccountStatementDetailDto"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []
  delete:
    tags:
      - account-statement
    summary: Soft-delete account statement by UUID
    description: >
      Marca como eliminado (status = 0) el estado de cuenta y todos sus registros
      en las 6 tablas auxiliares de tenant_finance (borrado lógico, sin eliminar filas físicas).
    operationId: softDeleteAccountStatement
    produces:
      - application/json
    parameters:
      - name: uuid
        in: path
        required: true
        type: string
        format: uuid
    responses:
      "200":
        description: Deleted
        schema:
          $ref: "../definitions/account-statement.yaml#/AccountStatementDeleteResponseDto"
      "404":
        description: Not found
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "401":
        description: Unauthorized
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
      "500":
        description: Internal error
        schema:
          $ref: "../definitions/common.yaml#/ExceptionWrapper"
    security:
      - bearerAuth: []
