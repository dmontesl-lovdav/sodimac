RebateDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier
    rebateNumber:
      type: string
      description: Rebate number
    vendorNumber:
      type: integer
      description: Vendor identifier
    amount:
      type: string
      description: Rebate amount
    status:
      type: integer
      description: Rebate status
    effectiveDate:
      type: string
      format: date-time
      description: Effective date
    expirationDate:
      type: string
      format: date-time
      description: Expiration date
    published:
      type: boolean
      description: Published status
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateRebateDto:
  type: object
  required:
    - rebateNumber
    - vendorNumber
    - amount
  properties:
    rebateNumber:
      type: string
    vendorNumber:
      type: integer
    amount:
      type: string
    status:
      type: integer
    effectiveDate:
      type: string
      format: date-time
    expirationDate:
      type: string
      format: date-time
    published:
      type: boolean

UpdateRebateDto:
  type: object
  properties:
    status:
      type: integer
    amount:
      type: string
    effectiveDate:
      type: string
      format: date-time
    expirationDate:
      type: string
      format: date-time
    published:
      type: boolean

RebateCreditNoteDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Identificador interno del documento fiscal
    uuid:
      type: string
      format: uuid
      description: UUID fiscal de la nota de credito
    registeredAt:
      type: string
      format: date-time
      description: Fecha de registro de la nota de credito
    amount:
      type: string
      description: Importe total de la nota de credito expresado como decimal
      example: "114.81"
    series:
      type: string
      x-nullable: true
      description: Serie de la nota de credito
    folio:
      type: string
      x-nullable: true
      description: Folio de la nota de credito
  required:
    - id
    - uuid
    - registeredAt
    - amount

RebateFiscalDetailDto:
  type: object
  properties:
    rebateId:
      type: string
      format: uuid
      description: UUID interno del descuento comercial consultado
    vendorNumber:
      type: integer
      x-nullable: true
      description: Numero del proveedor
    invoiceFiscalUuid:
      type: string
      format: uuid
      x-nullable: true
      description: UUID fiscal de la factura original relacionada
    ncFiscalUuid:
      type: string
      format: uuid
      x-nullable: true
      description: UUID fiscal de la nota de credito relacionada
    creditNotes:
      type: array
      description: Notas de credito disponibles para mostrar en el detalle
      items:
        $ref: "#/RebateCreditNoteDto"
    message:
      type: string
      x-nullable: true
      description: Mensaje informativo sobre la disponibilidad de la relacion fiscal
  required:
    - rebateId
    - creditNotes
