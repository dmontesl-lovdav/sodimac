<div th:fragment="fragmentStart" th:remove="tag">
  <div class="card" id="inicio">
  </div>
</div>
<!------------ Fragment No Results -------------->
<div th:fragment="noResults" th:remove="tag">
  <div class="card" id="sinRegistro">
    <div class="card-body">
      <div class="row">
        <div class="col-lg-12">
          <!--Grid row-->
          <div style="height: 60vh" class="d-flex flex-column justify-content-center align-items-center">
            <h1 class="h1 text-center mb-4">
              <i class="fas fa-search fa-lg mb-3 text-primary" style="opacity: .5;"></i><br> <strong
                class="text-primary">Sin
                registros</strong>
            </h1>
            <h5 class="p1 small text-center mb-3">
              No existe información con los filtros seleccionados.<br>
              Ingrese sus parámetros de consulta y presione el botón <strong>"Consultar"</strong>.
            </h5>
          </div>
          <!--Grid row-->
        </div>
      </div>
    </div>
  </div>
</div>
<!------------ Fragment Table Users Devices -------------->
<div th:fragment="fragmentMenuCards" th:remove="tag">
  <div class="card h-100" id="menuCards">
    <div class="view overlay">
    	<div class="card container bg-light">
    		<div th:each="menuModuleLvl0: ${menu}">
    			<i style="font-size:x-large" th:class="${menuModuleLvl0.icon}"></i>
    			<span class="card-title pt-2 mb-0" style="font-weight: bold;  font-size:x-large" th:text="${menuModuleLvl0.name}"></span>
     			<div class="row thumb-row">
	    		    <div th:each="menuItemLvl1: ${menuModuleLvl0.lstMenuItem}" class="col-sm-3 p-1">
					  	<a th:href="${menuItemLvl1.href}">
						    <div class="card mt-1">					     
						      <div class="card-body" style="font-size: large">
						   		<i th:class="${menuItemLvl1.icon}"></i>
						   		 <span class="card-title" style="font-weight: bold" th:text="${menuItemLvl1.name}"></span>
						      </div>
						    </div>
					    </a>
				  	</div>
			  	</div>
			</div>
    	</div>
	</div>
  </div>  
</div>
