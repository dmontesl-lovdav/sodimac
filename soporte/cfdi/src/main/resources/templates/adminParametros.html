	<div class="modal fade" id="readOnlySysParameterModalForm" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"	aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">

				<div class="modal-body">
					<form>
						<input type="hidden" id="action"/>

							<div class="col-md-6">
								<div class="form-group">
									<label for="exampleDropdown1">Aplicación</label>
									<select class="form-control" id="aplicacion" style="height: 3.4rem;" th:field="${parameter.aplicacion}" tabindex="1">
										<option th:each="aplicacion : ${aplicaciones}" th:value="${aplicacion[1]}" th:text="${aplicacion[1]}"></option>
									</select>
								</div>

<!--									</select>-->
<!--								</div>-->
								<div class="form-group">
									<label for="exampleInputEmail1">Nombre</label>
									<input type="text" class="form-control" id="nombreParametro" th:field="${parameter.nombreCampo}" tabindex="5" readonly>
								</div>
								<div class="form-group">
									<label for="exampleTextInput2">Descripción</label>
									<input type="text" class="form-control" id="descripcion" th:field="${parameter.descripcion}" tabindex="6">
								</div>
	
							</div>
							<div class="col-md-6">

									<label for="exampleDropdown2">Tipo de parametro</label>

								</div>

									<select class="form-control" id="estatus" style="height: 3.4rem;" th:field="${parameter.activo}" tabindex="4">

									</select>
								</div>
								<div class="form-group">
									<label for="exampleTextInput1">Valor</label>

	<!-- El formulario modal de edición -->
	<div class="modal fade" id="sysParameterModalForm" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"	aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="tituloFormulario"></h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<form th:action="@{./guardarParametro}" method="post" id="formParametro">
						<input type="hidden" id="action"/>
						<input type="hidden" class="form-control" id="fechaCreacion" th:field="${parameter.fechaCreacion}">
						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<label for="exampleDropdown1">Aplicación</label>
									<select class="form-control" id="aplicacion" style="height: 3.4rem;"
										th:field="${parameter.aplicacion}" tabindex="1">
										<option th:each="aplicacion : ${aplicaciones}" th:value="${aplicacion[1]}"
											th:text="${aplicacion[1]}"></option>
									</select>
								</div>
<!--								<div class="form-group">-->
<!--									<label for="exampleDropdown2">Rol</label>-->
<!--									<select class="form-control" id="rol" style="height: 3.4rem;"-->
<!--										th:field="${parameter.idGrupoUsuario}" tabindex="3">-->
<!--										<option th:each="rol : ${roles}" th:value="${rol[0]}" th:text="${rol[1]}"></option>-->
<!--									</select>-->
<!--								</div>-->
								<div class="form-group">
									<label for="nombreParametro">Nombre</label>
									<input type="text" class="form-control" id="nombreParametro" th:field="${parameter.nombreCampo}" tabindex="2" onkeypress="txtnombreCampo_onkeypress();" maxlength="70">
								</div>
								<div class="form-group">
									<label for="descripcion">Descripción</label>
									<input type="text" class="form-control" id="descripcion" th:field="${parameter.descripcion}" tabindex="3" maxlength="150">
								</div>
								<div class="form-group">
									<label for="tipoParametro">Tipo de parametro</label>
									<select class="form-control" id="tipoParametro" style="height: 3.4rem;" th:field="${parameter.idTipoDato}" tabindex="4">
										<option th:each="tipoParametro : ${tiposParametro}" th:value="${tipoParametro[0]}" th:text="${tipoParametro[1]}"></option>
									</select>
								</div>

							</div>
							<div class="col-md-6">
								<div th:if="${session.privsUsuario.d eq 1}" class="form-group">
									<label for="estatus">Estatus</label>
									<select class="form-control" id="estatus" style="height: 3.4rem;" th:field="${parameter.activo}" tabindex="5">  
										<option th:each="estado : ${estados}" th:value="${estado[0]}" th:text="${estado[1]}"></option>
									</select>
								</div>
								<div class="form-group">
									<label for="valor">Valor</label>
									<textarea class="form-control" id="valor" th:field="${parameter.valor}" rows="7" cols="50" tabindex="6">
										</textarea>
	<!--								<input type="text" class="form-control" id="valor" th:field="${parameter.valor}">-->
								</div>
								<div class="form-group">

									</textarea>
								</div>

							</div>
						</div>
						<button th:if="${session.privsUsuario.c eq 1 or session.privsUsuario.u eq 1}" type="submit" class="btn btn-primary">Guardar</button>
					</form>
				</div>

		                                    Exportar a Excel

		                            </div>
			                        <div id="messages_consultas_multiples" style="margin-left: 20px;">

		                    </div><!-- /.card-body -->
